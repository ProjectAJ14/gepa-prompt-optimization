<style>

<script>
"use strict";
/* ponytail: all data is mocked and inline; one file so it works offline on stage. */

const LABELS = ["SCHEMA_DRIFT", "LATE_DATA", "RESOURCE_EXHAUSTED", "DATA_QUALITY", "UPSTREAM_FAILURE"];

// Invented failure logs. `added` logs only join the training set on the "fix the data" screen.
const LOGS = [
  { id: 1,  pipe: "airflow-orders", split: "val",   exp: "SCHEMA_DRIFT",       text: "Task load_orders failed: column 'order_total' not found in source table (expected 14 columns, got 13)" },
  { id: 2,  pipe: "airflow-orders", split: "val",   exp: "LATE_DATA",          text: "Sensor wait_for_file timed out after 6h: s3://raw/orders/2026-10-20/ not found" },
  { id: 3,  pipe: "airflow-orders", split: "val",   exp: "RESOURCE_EXHAUSTED", text: "Task dedupe killed: container exceeded memory limit 8Gi" },
  { id: 4,  pipe: "spark-clicks",   split: "train", exp: "RESOURCE_EXHAUSTED", text: "ExecutorLostFailure: executor 12 exited (OOMKilled)" },
  { id: 5,  pipe: "spark-clicks",   split: "train", exp: "SCHEMA_DRIFT",       text: "AnalysisException: cannot resolve 'device_type' given input columns: [device, ts, user_id]" },
  { id: 6,  pipe: "spark-clicks",   split: "train", exp: "LATE_DATA",          text: "Checkpoint lag 47 min behind source; no new offsets since 02:10" },
  { id: 7,  pipe: "dbt-finance",    split: "train", exp: "DATA_QUALITY",       text: "Test not_null_invoices_amount failed: 312 rows with null amount" },
  { id: 8,  pipe: "dbt-finance",    split: "train", exp: "UPSTREAM_FAILURE",   text: "Connection refused: warehouse.internal:5439 (3 retries)" },
  { id: 9,  pipe: "dbt-finance",    split: "train", exp: "DATA_QUALITY",       text: "Test unique_payments_id failed: 18 duplicate ids" },
  { id: 10, pipe: "kafka-events",   split: "test",  exp: "UPSTREAM_FAILURE",   text: "Broker 2 unreachable; leader election pending for 9 partitions" },
  { id: 11, pipe: "kafka-events",   split: "test",  exp: "LATE_DATA",          text: "Topic events.v3 empty for 4h; batch window closed with 0 records" },
  { id: 12, pipe: "kafka-events",   split: "test",  exp: "SCHEMA_DRIFT",       text: "Deserialization error: field 'ts' is string, schema says long (offset 88123)" },
  { id: 13, pipe: "flink-sessions", split: "train", exp: "SCHEMA_DRIFT",       text: "Cannot cast field 'amount' from STRING to DOUBLE: value 'N/A'", added: true },
  { id: 14, pipe: "flink-sessions", split: "train", exp: "SCHEMA_DRIFT",       text: "Avro reader: expected int for field 'version', found string", added: true },
];

// Fixed model outputs per prompt version, so the demo never calls a model.
const OUT = {
  v1: {
    1: "This looks like a schema problem: a column is missing from the source.",
    2: "The file did not arrive in time.",
    3: "Out of memory.",
    4: "The Spark executor was killed, probably memory.",
    5: "Spark can't find the column device_type.",
    6: "The checkpoint is behind.",
    7: "A data quality test failed because of null values.",
    8: "Can't connect to the warehouse.",
    9: "Duplicate ids found.",
    10: "A Kafka broker is down.",
    11: "Nothing arrived on the topic.",
    12: "A type mismatch while reading a message.",
  },
  v2: {
    1: ["SCHEMA_DRIFT", "A column the job expects is missing from the source."],
    2: ["LATE_DATA", "The expected file never arrived before the sensor timed out."],
    3: ["UPSTREAM_FAILURE", "The task was killed by the platform."],
    4: ["UPSTREAM_FAILURE", "An executor was lost during the job."],
    5: ["SCHEMA_DRIFT", "The query refers to a column that is not in the input."],
    6: ["UPSTREAM_FAILURE", "The source stopped producing new offsets."],
    7: ["DATA_QUALITY", "Null values in a column that must not be null."],
    8: ["UPSTREAM_FAILURE", "The warehouse refused the connection."],
    9: ["DUPLICATES", "Several rows share the same id."],
    10: ["UPSTREAM_FAILURE", "A broker is down and partitions have no leader."],
    11: ["UPSTREAM_FAILURE", "The producer appears to have stopped sending messages to the topic, so no records reached the batch."],
    12: ["DATA_QUALITY", "A value has the wrong type."],
  },
  v3: {
    1: ["SCHEMA_DRIFT", "A column the job expects is missing from the source."],
    2: ["LATE_DATA", "The expected file never arrived before the sensor timed out."],
    3: ["RESOURCE_EXHAUSTED", "The task was killed for exceeding its memory limit."],
    4: ["RESOURCE_EXHAUSTED", "The executor was killed for using too much memory."],
    5: ["SCHEMA_DRIFT", "The query refers to a column that is not in the input."],
    6: ["LATE_DATA", "The checkpoint is far behind the source."],
    7: ["DATA_QUALITY", "Null values in a column that must not be null."],
    8: ["UPSTREAM_FAILURE", "The warehouse refused the connection."],
    9: ["DATA_QUALITY", "Several rows share the same id."],
    10: ["UPSTREAM_FAILURE", "A broker is down and partitions have no leader."],
    11: ["LATE_DATA", "The topic stayed empty and the batch closed with no records."],
    12: ["DATA_QUALITY", "A value has the wrong type."],
    13: ["DATA_QUALITY", "The value N/A is not a number."],
    14: ["DATA_QUALITY", "A field holds the wrong kind of value."],
  },
  v4: {
    11: ["LATE_DATA", "The topic stayed empty for hours and the batch window closed with zero records, so the data is late."],
    12: ["SCHEMA_DRIFT", "A field's type does not match the schema."],
    13: ["SCHEMA_DRIFT", "The amount field is a string where a number is expected."],
    14: ["SCHEMA_DRIFT", "The version field has the wrong type."],
  },
};
OUT.v4 = Object.assign({}, OUT.v3, OUT.v4);
// A rejected candidate: right labels, replies that ramble.
OUT.B = {};
for (const id of Object.keys(OUT.v3)) {
  OUT.B[id] = [OUT.v3[id][0], OUT.v3[id][1] + " I considered every other label in turn and ruled each of them out before settling on this one."];
}

const rawOf = (v, id) => {
  const o = OUT[v][id];
  if (o === undefined) return ""; // no mocked output for this log: fails every gate instead of throwing
  return typeof o === "string" ? o : JSON.stringify({ label: o[0], reason: o[1] });
};

// Gates first, then quality: a failed gate keeps the score under 0.5.
function judge(v, log) {
  const raw = rawOf(v, log.id);
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { o = null; }
  const json = !!(o && typeof o.label === "string" && typeof o.reason === "string");
  const allowed = json && LABELS.includes(o.label);
  const correct = allowed && o.label === log.exp;
  const passed = [json, allowed, correct].filter(Boolean).length;
  let score;
  if (passed === 3) {
    const words = o.reason.trim().split(/\s+/).length;
    score = 0.5 + 0.5 * (words <= 15 ? 1 : 0.5);
  } else {
    score = (passed / 3) * 0.5;
  }
  return { raw, json, allowed, correct, score };
}
const inSet = (l, ext) => !l.added || ext;
const mean = (v, split, ext) => {
  const rows = LOGS.filter((l) => l.split === split && inSet(l, ext));
  return rows.reduce((s, l) => s + judge(v, l).score, 0) / rows.length;
};
const f3 = (x) => x.toFixed(3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- prompts ---------- */
// The hand techniques, in the order they are added on the Version 2 screen. Tags come last,
// because they are what keeps several inputs and sections of one prompt apart.
const TECH = [
  { key: "labels",  label: "List the allowed labels", why: "Say exactly which answers are allowed, so the model stops inventing its own." },
  { key: "example", label: "Show one example",        why: "One worked case shows the shape of a good answer." },
  { key: "edge",    label: "Name the edge cases",     why: "Say what to do when the log fits no label." },
  { key: "format",  label: "Say the output format",   why: "Ask for JSON only, so a script can read the reply." },
  { key: "tags",    label: "Tag the inputs",          why: "Wrap each section in its own XML tag, so the model can tell the labels, the example, the rules and the log apart." },
];
const LAB = "SCHEMA_DRIFT, LATE_DATA, RESOURCE_EXHAUSTED, DATA_QUALITY, UPSTREAM_FAILURE";
const EX_LOG = "Task export failed: connection reset by peer";
const EX_ANS = "{\"label\": \"UPSTREAM_FAILURE\", \"reason\": \"The source dropped the connection.\"}";

// The prompt after k techniques (0 = version 1). `hot` marks the text the latest step added.
// Optimizer `rules` land in the rules block, above the format line.
function v2Segs(k, rules = [], hotRule = -1, flash = true) {
  const hk = flash ? k : -1;
  const tagged = k >= 5;
  const tag = (name, inner) => tagged
    ? [{ t: `<${name}>`, hot: hk === 5 }, { t: "\n" }, ...inner, { t: "\n" }, { t: `</${name}>`, hot: hk === 5 }]
    : inner;
  const parts = [[{ t: "Classify this pipeline failure log." }]];
  if (k >= 1) parts.push(tag("labels", [{ t: tagged ? LAB : `Labels: ${LAB}`, hot: hk === 1 }]));
  if (k >= 2) {
    const inner = tagged
      ? [{ t: "<log>", hot: hk === 5 }, { t: EX_LOG }, { t: "</log>", hot: hk === 5 }, { t: "\n" }, { t: "<answer>", hot: hk === 5 }, { t: EX_ANS }, { t: "</answer>", hot: hk === 5 }]
      : [{ t: `Example:\nLog: ${EX_LOG}\nAnswer: ${EX_ANS}`, hot: hk === 2 }];
    parts.push(tag("example", inner));
  }
  if (k >= 3) {
    const lines = [{ t: "If unsure, pick the closest label. Never invent one.", hot: hk === 3 }];
    rules.forEach((r, i) => lines.push({ t: "\n" }, { t: r, hot: i === hotRule }));
    if (k >= 4) lines.push({ t: "\n" }, { t: "Reply with JSON only: {\"label\": \"...\", \"reason\": \"...\"}", hot: hk === 4 });
    parts.push(tag("rules", lines));

      ["focused", "Version 4: one more rule, appended."], ["worried", "We peeked at test. That number is not clean."]],
    notes: "Two training logs that show a type mismatch. Run again, the optimizer adds one rule, then the table. Then be honest: we peeked at test to find this, so its test number is no longer clean.",
    render: (st) => {
      const added = LOGS.filter((l) => l.added);
      const rows = [
        { n: 0, read: "Starting prompt (v3), train set now 8 logs", edit: "None", tr: mean("v3", "train", true), va: mean("v3", "val"), verdict: "start" },
        { n: 1, read: "Logs 13 and 14 (type mismatches) were called DATA_QUALITY.", edit: ADD4.join(" "), tr: mean("v4", "train", true), va: mean("v4", "val"), verdict: "kept" },
      ];
      const shown = rows.slice(0, Math.min(st, 2));
      const t = (v) => f3(mean(v, "test"));
      const optTable = `<div class="scroll"><table class="compact"><thead><tr><th>#</th><th>What it read</th><th>Edit it proposed</th><th class="num">train</th><th class="num">val</th><th>Kept?</th></tr></thead>
        <tbody>${shown.map((r) => `<tr class="reveal"><td class="num">${r.n}</td><td>${esc(r.read)}</td><td style="white-space:normal">${esc(r.edit)}</td><td class="num">${f3(r.tr)}</td><td class="num">${f3(r.va)}</td><td class="${r.verdict === "kept" ? "ok" : "faint"}">${esc(r.verdict)}</td></tr>`).join("")}</tbody></table></div>`;
      const logs = `<div class="scroll"><table class="compact"><thead><tr><th>#</th><th>Pipeline</th><th>Split</th><th>Log</th><th class="num">Expected</th></tr></thead><tbody>
        ${added.map((l) => `<tr><td class="num">${l.id}</td><td>${esc(l.pipe)}</td><td>${splitPill(l.split)}</td><td class="log" title="${esc(l.text)}">${esc(l.text)}</td><td class="num">${esc(l.exp)}</td></tr>`).join("")}</tbody></table></div>`;
      if (st === 3) {
        return `${head("Version 4", "One more rule, <em>appended</em>", "", true)}
          <pre class="prompt small reveal">${segsHtml(v2Segs(5, ADD3.concat(ADD4), ADD3.length, false))}</pre>`;
      }
      if (st >= 4) {
        return `${head("Version 4, scored", "The number you <em>cannot trust</em>", "", true)}
          <div class="block scroll reveal"><table><thead><tr><th>Prompt</th><th class="num">val</th><th class="num">test</th></tr></thead><tbody>
            <tr><td>v2</td><td class="num">${f3(mean("v2", "val"))}</td><td class="num">${t("v2")}</td></tr>
            <tr><td>v3</td><td class="num">${f3(mean("v3", "val"))}</td><td class="num">${t("v3")}</td></tr>
            <tr><td>v4</td><td class="num">${f3(mean("v4", "val"))}</td><td class="num warn">${t("v4")} <span class="pill test">peeked</span></td></tr></tbody></table></div>
          <div class="note warnnote reveal"><b>The v4 test number is not clean.</b> We looked at test to find the gap, then changed the data because of it. To claim it, hold out a fresh test pipeline. Also, three logs per split is a toy: one wrong label moves a split by 0.222. And v4 is not 1.000 only because one reply ran past 15 words, though the prompt asks for 15 or fewer. An instruction is a request. A check is a rule.</div>`;
      }
      return `${head("Run 2", "Add the examples it was <em>missing</em>", "", true)}${logs}
        ${st === 0 ? `<div class="row" style="margin-top:12px"><button class="primary" data-act="next">Run the optimizer again</button></div>` : ""}
        ${shown.length ? optTable : ""}`;
    },
  },
  {
    id: "real", title: "A real run, from Eklavya", tag: "real", steps: 2,
    hints: [["neutral", "Real numbers now, from Eklavya's own result notes."], ["worried", "A limit the score ignored."], ["wink", "This slot is ready for the fixed evals."]],
    notes: "These two are real, from Eklavya's own result notes (9 and 10 October 2026). Replace or extend after the evals are fixed.",
    render: (st) => `
      ${head("Not a mock", "The same lessons, from a <em>real</em> tool")}
      <div class="cluster wide">
        <div class="card reveal"><h3>Validation against test</h3>
          <p>A GEPA candidate for Eklavya's question-writing prompt.</p>
          <table><thead><tr><th></th><th class="num">Shipped</th><th class="num">Candidate</th></tr></thead><tbody>
            <tr><td>Validation (chosen on)</td><td class="num">0.48</td><td class="num">0.79</td></tr>
            <tr><td>Test (untouched)</td><td class="num">0.545</td><td class="num">0.637</td></tr></tbody></table>
          <p class="faint" style="margin-top:8px">The note's own words: that gap is selection, not generalisation. Recommendation: do not ship the candidate.</p></div>
        ${st >= 1 ? `<div class="card reveal"><h3>A limit the score ignored</h3>
          <p>A GEPA candidate for Eklavya's prompt feedback.</p>
          <table><thead><tr><th></th><th class="num">Shipped</th><th class="num">Candidate</th></tr></thead><tbody>
            <tr><td>Timeouts</td><td class="num">1 of 15</td><td class="num">6 of 15</td></tr>
            <tr><td>Pass every gate</td><td class="num">10 of 15</td><td class="num">6 of 15</td></tr>
            <tr><td>Mean score</td><td class="num">0.718</td><td class="num">0.456</td></tr></tbody></table>
          <p class="faint" style="margin-top:8px">Latency was reported but not scored, so the search could not see it. Not shipped.</p></div>` : ""}
      </div>
      ${st >= 2 ? `<div class="placeholder reveal">Placeholder: swap in a before and after from the fixed evals when they exist (Eklavya issue #235).</div>` : ""}`,
  },
  {
    id: "checklist", title: "The checklist", tag: null, steps: 3,
    hints: [["focused", "Gates, examples, and a split by source."], ["focused", "Baseline, a bar, and every limit in the score."], ["happy", "Record it, enforce it in code, look at test once."], ["celebrate", "Questions welcome."]],
    notes: "Three items at a time. Read none of it aloud. Pick the two you most want them to remember. Then questions.",
    render: (st) => {
      const items = [
        "<b>Write the gates first.</b> Hard requirements as pass or fail.",
        "<b>Freeze examples</b> with the expected answer next to each.",
        "<b>Split by source,</b> not by row.",
        "<b>Baseline with repeats.</b> Score the current prompt the same way.",
        "<b>Fix the bar up front.</b> How many examples, how much difference counts.",
        "<b>Put every limit in the score:</b> time, size, cost.",
        "<b>Record everything:</b> model ids, tokens, seed.",
        "<b>Code before wording</b> when code can enforce it.",
        "<b>Look at test once,</b> and say so if you looked twice.",
      ];
      return `
      ${head("Take this home", "Before you point an optimizer at a <em>prompt</em>")}
      <ol class="checks">${items.slice(0, Math.min(9, (st + 1) * 3)).map((x) => `<li class="reveal">${x}</li>`).join("")}</ol>
      ${st >= 3 ? `<p class="lede reveal" style="text-align:center;margin-top:24px">Questions?</p>` : ""}`;
    },
  },
];

/* ---------- navigation ---------- */
const $ = (id) => document.getElementById(id);
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(i, mode) {
  clearInterval(timer);
  S.i = Math.max(0, Math.min(SCREENS.length - 1, i));
  const sc = SCREENS[S.i];
  if (mode === "start") setStep(sc.id, 0);
  else if (mode === "end") setStep(sc.id, sc.steps);
  if (location.hash !== "#" + (S.i + 1)) history.replaceState(null, "", "#" + (S.i + 1));
  draw();
}
function next() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st < sc.steps) { setStep(sc.id, st + 1); draw(); }
  else if (S.i < SCREENS.length - 1) go(S.i + 1, "start");
}
function prev() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st > 0) { clearInterval(timer); setStep(sc.id, st - 1); draw(); }
  else if (S.i > 0) go(S.i - 1, "end");
}
function draw() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  const slide = $("slide");
  const before = S.last === sc.id ? slide.getBoundingClientRect() : null;
  slide.innerHTML = sc.render(st);
  // The slide is vertically centred, so adding content moves it. Glide it instead of jumping.
  if (before && !reduced() && slide.animate) {
    const dy = before.top - slide.getBoundingClientRect().top;
    if (Math.abs(dy) > 2) slide.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: 280, easing: "cubic-bezier(.2,.6,.2,1)" });
  }
  if (S.last !== sc.id) $("main").scrollTop = 0;
  S.last = sc.id;
  $("count").textContent = `${String(S.i + 1).padStart(2, "0")} / ${SCREENS.length}`;
  $("crumb").textContent = sc.title;
  $("jump").value = String(S.i);
  const tag = $("tag");
  const tagText = { example: "Example data", real: "Real data", ref: "From the GEPA repo" }[sc.tag] || "";
  tag.hidden = !tagText;
  tag.className = "tag " + (sc.tag || "");
  tag.textContent = tagText;
  $("stepinfo").textContent = sc.steps ? `step ${st} / ${sc.steps}` : "";
  $("prev").disabled = S.i === 0 && st === 0;
  $("next").disabled = S.i === SCREENS.length - 1 && st >= sc.steps;
  document.querySelectorAll(".dot").forEach((d, k) => d.setAttribute("aria-current", String(k === S.i)));
  // The companion: a small face and one short line per step. Hidden on the title, where the full mascot already is.
  const hint = sc.hints[Math.min(st, sc.hints.length - 1)];
  const comp = $("companion");
  comp.hidden = !hint[1];
  if (hint[1]) comp.innerHTML = `<div class="mascot">${EklavyaMascot.svg({ expression: hint[0], variant: "face", size: 56 })}</div><div class="bubble reveal">${esc(hint[1])}</div>`;
  const n = $("notes");
  n.hidden = !S.notes;
  n.textContent = sc.notes;
}
function animateTo(max) {
  clearInterval(timer);
  const id = SCREENS[S.i].id;
  timer = setInterval(() => {
    if (SCREENS[S.i].id !== id) { clearInterval(timer); return; }
    const n = stepOf(id) + 1;
    setStep(id, n); draw();
    if (n >= max) clearInterval(timer);
  }, 650);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const [act, arg] = el.dataset.act.split(":");
  const id = SCREENS[S.i].id;
  if (act === "next") next();
  else if (act === "goto") { setStep(id, Number(arg)); draw(); }
  else if (act === "run1") { setStep(id, 1); draw(); animateTo(4); }
});
$("prev").addEventListener("click", prev);
$("next").addEventListener("click", next);
$("jump").addEventListener("change", (e) => go(Number(e.target.value)));
SCREENS.forEach((sc, k) => {
  const o = document.createElement("option");
  o.value = String(k); o.textContent = `${k + 1}. ${sc.title}`;
  $("jump").appendChild(o);
  const d = document.createElement("button");
  d.className = "dot"; d.type = "button"; d.setAttribute("aria-label", `Screen ${k + 1}: ${sc.title}`);
  d.addEventListener("click", () => go(k));
  $("dots").appendChild(d);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, "start");
  else if (e.key === "End") go(SCREENS.length - 1, "end");
  else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; draw(); }
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== S.i) go(n - 1); });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
