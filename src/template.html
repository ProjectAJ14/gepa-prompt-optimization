// Gates first, then quality: a failed gate keeps the score under 0.5.
function scoreReply(raw, expected) {
  let o = null;
  try { o = JSON.parse(raw.trim()); } catch (e) { o = null; }
  const json = !!(o && typeof o.label === "string" && typeof o.reason === "string");
  const allowed = json && LABELS.includes(o.label);
  const correct = allowed && o.label === expected;
  const passed = [json, allowed, correct].filter(Boolean).length;
  let score;
  if (passed === 3) {
    const words = o.reason.trim().split(/\s+/).length;
    score = 0.5 + 0.5 * (words <= 15 ? 1 : 0.5);
  } else {
    score = (passed / 3) * 0.5;
  }
  return { raw, json, allowed, correct, score, words: json ? o.reason.trim().split(/\s+/).length : null };
}
const f3 = (x) => x.toFixed(3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- prompts ---------- */
// The hand techniques, in the order they are added on the Version 2 screen. Tags come last,
// because they are what keeps several inputs and sections of one prompt apart.
const TECH = [
  { key: "labels",  label: "List the allowed labels", why: "Say exactly which answers are allowed, so the model stops inventing its own." },
  { key: "example", label: "Show one example",        why: "One worked case shows the shape of a good answer." },
  { key: "edge",    label: "Name the edge cases",     why: "Say what to do when the log fits no label." },
  { key: "format",  label: "Say the output format",   why: "Ask for JSON only, so a script can read the reply." },
  { key: "tags",    label: "Tag the inputs",          why: "Wrap each section in its own XML tag, so the model can tell the labels, the example, the rules and the log apart." },
];
const LAB = "SCHEMA_DRIFT, LATE_DATA, RESOURCE_EXHAUSTED, DATA_QUALITY, UPSTREAM_FAILURE";
const EX_LOG = "Task export failed: connection reset by peer";
const EX_ANS = "{\"label\": \"UPSTREAM_FAILURE\", \"reason\": \"The source dropped the connection.\"}";

// The prompt after k techniques (0 = version 1). `hot` marks the text the latest step added.
// Optimizer `rules` land in the rules block, above the format line.
function v2Segs(k, rules = [], hotRule = -1, flash = true) {
  const hk = flash ? k : -1;
  const tagged = k >= 5;
  const tag = (name, inner) => tagged
    ? [{ t: `<${name}>`, hot: hk === 5 }, { t: "\n" }, ...inner, { t: "\n" }, { t: `</${name}>`, hot: hk === 5 }]
    : inner;
  const parts = [[{ t: "Classify this pipeline failure log." }]];
  if (k >= 1) parts.push(tag("labels", [{ t: tagged ? LAB : `Labels: ${LAB}`, hot: hk === 1 }]));
  if (k >= 2) {
    const inner = tagged
      ? [{ t: "<log>", hot: hk === 5 }, { t: EX_LOG }, { t: "</log>", hot: hk === 5 }, { t: "\n" }, { t: "<answer>", hot: hk === 5 }, { t: EX_ANS }, { t: "</answer>", hot: hk === 5 }]
      : [{ t: `Example:\nLog: ${EX_LOG}\nAnswer: ${EX_ANS}`, hot: hk === 2 }];
    parts.push(tag("example", inner));
  }
  if (k >= 3) {
    const lines = [{ t: "If unsure, pick the closest label. Never invent one.", hot: hk === 3 }];
    rules.forEach((r, i) => lines.push({ t: "\n" }, { t: r, hot: i === hotRule }));
    if (k >= 4) lines.push({ t: "\n" }, { t: "Reply with JSON only: {\"label\": \"...\", \"reason\": \"...\"}", hot: hk === 4 });
    parts.push(tag("rules", lines));
  }
  parts.push(k >= 5 ? tag("log", [{ t: "{{log}}", cls: "var" }]) : [{ t: "{{log}}", cls: "var" }]);
  const out = [];
  parts.forEach((p, i) => { if (i) out.push({ t: "\n\n" }); out.push(...p); });
  return out;
}
const segsHtml = (segs) => segs.map((s) => {
  const cls = [s.cls, s.hot ? "add" : ""].filter(Boolean).join(" ");
  return cls ? `<span class="${cls}">${esc(s.t)}</span>` : esc(s.t);
}).join("");
const P1 = v2Segs(0);

// Stick figures for the GEPA screens: one head, one body, a hat or prop per role. Colours are role tokens.
const STICK = {
  teacher: `<path d="M27 40h26v7H27z" fill="var(--viz-3)"/><rect x="52" y="76" width="24" height="18" fill="var(--viz-2-soft)"/><path d="M56 76v-7h7v7" fill="none"/>`,

  coach: `<path d="M26 16h28v5H26z" fill="var(--viz-2)"/><path d="M58 76l14-22" stroke="var(--viz-2)" stroke-width="5" fill="none"/>`,
  judge: `<path d="M28 14V3l6 6 6-8 6 8 6-6v11z" fill="var(--viz-4)"/>`,
};
const stick = (kind) => `<svg class="stick" viewBox="0 0 84 140" role="img" aria-label="${kind}"><circle cx="40" cy="26" r="14" fill="var(--panel)"/><path d="M40 40v46M40 52l-18 18M40 52l20 14M40 86l-14 46M40 86l14 46"/><circle cx="35" cy="25" r="1.6" fill="var(--ink)" stroke="none"/><circle cx="45" cy="25" r="1.6" fill="var(--ink)" stroke="none"/><path d="M34 31q6 5 12 0" stroke-width="2"/>${STICK[kind]}</svg>`;

const SAMPLE = [11, 2, 6, 22];
const splitPill = (s) => `<span class="pill ${s}">${s}</span>`;
const head = (eyebrow, title, lede, dense) => `<div class="head${dense ? " dense" : ""}"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${lede ? `<p class="lede">${lede}</p>` : ""}</div>`;
const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${esc(text)}</a>`;

/* ---------- live model calls ----------
   Versions 1 and 2 run for real through server.mjs, which calls `claude -p`: one model acts, a different one
   grades. Nothing is mocked on these screens. If the server is not running, they say so instead of inventing output. */
const blankRuns = () => ({ v1: {}, v2: {}, v3: {}, v4: {}, v5: {}, v6: {}, v7: {} });
const R = { coachBad: {}, status: "checking", actor: "", grader: "", mode: "live", act: blankRuns(), grade: blankRuns(), cand: { v3: null }, loop: null, coachModel: "", coachRes: null, err: {}, busy: new Set(), since: {}, recorded: 0, confirmReset: false, note: "" };
const nice = (m) => String(m || "").replace(/^claude-/, "").replace(/-(\d)-(\d)$/, " $1.$2").replace(/^./, (c) => c.toUpperCase());
const segText = (segs) => segs.map((x) => x.t).join("");
const livePrompt = (v) => (v === "v1" ? segText(v2Segs(0)) : v === "v2" ? segText(v2Segs(5)) : R.cand[v] ? R.cand[v].prompt : "");
const ALL = LOGS;
const busyAdd = (key) => { R.busy.add(key); R.since[key] = Date.now(); };
async function api(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json", "x-walkthrough": "1" }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}
let redrawQueued = false;
const redraw = () => { if (redrawQueued) return; redrawQueued = true; requestAnimationFrame(() => { redrawQueued = false; draw(); }); };
async function pool(jobs, n) { let i = 0; await Promise.all(Array.from({ length: Math.min(n, jobs.length) }, async () => { while (i < jobs.length) await jobs[i++](); })); }
// Asks the actor for each log (and, when asked, the grader for each reply). Safe to call on every draw: it skips what is done, running or failed.
function ensure(v, ids, withGrade) {
  if (R.status !== "live" || !livePrompt(v)) return;
  const jobs = [];
  for (const id of ids) {
    const log = LOGS.find((l) => l.id === id), ka = `a:${v}:${id}`, kg = `g:${v}:${id}`;
    const needAct = !R.act[v][id] && !R.busy.has(ka) && !R.err[ka];
    const needGrade = withGrade && !R.grade[v][id] && !R.busy.has(kg) && !R.err[kg] && (R.act[v][id] || needAct);
    if (!needAct && !needGrade) continue;
    if (needAct) busyAdd(ka);
    if (needGrade) busyAdd(kg);
    jobs.push(async () => {
      if (needAct) {
        try { R.act[v][id] = await api("/api/act", { prompt: livePrompt(v).replace("{{log}}", () => log.text) }); } catch (e) { R.err[ka] = String(e.message || e); }
        R.busy.delete(ka); redraw();
      }
      if (needGrade) {
        if (R.act[v][id]) { try { R.grade[v][id] = await api("/api/grade", { log: log.text, expected: log.exp, reply: R.act[v][id].text || "(empty reply)" }); } catch (e) { R.err[kg] = String(e.message || e); } }
        R.busy.delete(kg); redraw();
      }
    });
  }
  if (jobs.length) { redraw(); pool(jobs, 4); }
}
// The three gates and the score, applied to a real reply. null while the model has not answered yet.
function liveJudge(v, l) {
  const a = R.act[v][l.id];
  if (!a) return null;
  const g = R.grade[v][l.id];
  return { ...scoreReply(a.text, l.exp), right: g ? g.rightIdea : null, why: g ? g.why : "" };
}
function liveMean(v, split) {
  const js = ALL.filter((l) => l.split === split).map((l) => liveJudge(v, l));
  return js.some((j) => !j) ? null : js.reduce((t, j) => t + j.score, 0) / js.length;
}
// Waiting for a model: the working critter (src/claude-loader.svg), what it waits for and the seconds so far. Small waits use the ring.
const spinner = `<span class="spinner" aria-hidden="true"></span>`;
const CLAUDE_LOADER = `/*LOADER_SVG*/`;
const claudeLoader = (width) => `<span class="claude-loader" style="width:${width}px">${CLAUDE_LOADER}</span>`;
const loader = (what, key, width = 96) => `<div class="loader" role="status"><span class="loader-art">${claudeLoader(width)}</span><span>${esc(what)}</span><span class="mono elapsed" data-since="${R.since[key] || Date.now()}">0 s</span></div>`;
const when = (a) => a && a.at ? new Date(a.at).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "time not recorded";
// Every call shows its time and its tokens. "in" counts everything the model read (fresh, cached and cache-written input); "out" is what it wrote.
const tokIn = (a) => (a && a.tokens ? (a.tokens.input || 0) + (a.tokens.cacheWrite || 0) + (a.tokens.cacheRead || 0) : 0);
const tokOut = (a) => (a && a.tokens ? a.tokens.output || 0 : 0);
const fmtN = (n) => (n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));
const fmtMs = (ms) => (ms < 60000 ? (ms / 1000).toFixed(1) + " s" : Math.floor(ms / 60000) + " min " + String(Math.round((ms % 60000) / 1000)).padStart(2, "0") + " s");
const metaLine = (a) => `${nice(a.model)} · ${when(a)} · ${(a.ms / 1000).toFixed(1)} s · ${fmtN(tokIn(a))} in, ${fmtN(tokOut(a))} out tokens${a.cached ? " · recorded" : ""}`;
// "Run now": call the model again for one call, ignoring the recording.
const runNow = (kind, v, id, label) => {
  const busy = R.busy.has(`${kind === "act" ? "a" : "g"}:${v}:${id}`), off = R.status !== "live" || R.mode === "replay";
  const why = off ? (R.mode === "replay" && R.status === "live" ? "Replay mode never calls a model" : "Not connected to the server") : "Call the model again and ignore the recording";
  return `<button class="tab runnow" data-act="rerun:${kind}:${v}:${id}" ${busy || off ? "disabled" : ""} title="${why}">${busy ? spinner + "Running…" : label}</button>`;
};
async function rerun(kind, v, id) {
  if (R.status !== "live" || R.mode === "replay") return;
  const log = LOGS.find((l) => l.id === id), ka = `a:${v}:${id}`, kg = `g:${v}:${id}`, key = kind === "act" ? ka : kg;
  if (R.busy.has(key)) return;
  busyAdd(key); delete R.err[key]; redraw();
  try {
    if (kind === "act") { R.act[v][id] = await api("/api/act", { prompt: livePrompt(v).replace("{{log}}", () => log.text), fresh: true }); delete R.grade[v][id]; delete R.err[kg]; }
    else R.grade[v][id] = await api("/api/grade", { log: log.text, expected: log.exp, reply: R.act[v][id].text || "(empty reply)", fresh: true });
  } catch (e) { R.err[key] = String(e.message || e); }
  R.busy.delete(key); redraw();
}
// All four sample runs at once, one cell each: the exact prompt, the model's reply, when it ran, and Run now.
// Prompt and reply sit in fixed-size, read-only, scrollable boxes. The prompt box starts scrolled to its end, where the log line differs.
function runGrid(v) {
  const cells = SAMPLE.map((id, n) => {
    const l = LOGS.find((x) => x.id === id), a = R.act[v][id], e = R.err[`a:${v}:${id}`], running = R.busy.has(`a:${v}:${id}`);
    const notConnected = !a && !running && R.status === "offline";
    const waiting = !notConnected && (running || (!a && !e));
    let seen = "";
    if (a && !running) { const j = scoreReply(a.text, l.exp); seen = j.json ? "A script can parse this reply." : a.text.trim().startsWith("```") ? "A script cannot parse it: wrapped in a code fence." : "A script cannot parse it: not JSON."; }
    const out = notConnected ? `<pre tabindex="0">Not connected to the server, so this call cannot run. In a terminal: node server.mjs</pre>` : waiting ? `<div class="boxfix">${loader(`${nice(R.actor) || "The model"} is answering…`, `a:${v}:${id}`, 56)}</div>`
      : `<pre tabindex="0" aria-label="Model output, log ${id}">${a ? esc(a.text.trim()) : `The call failed: ${esc(e)}`}</pre>`;
    return `<div class="cell">
      <div class="cellhead"><b>Run ${n + 1}</b> · log ${id} · ${esc(l.pipe)}</div>
      <div class="cellbody">
        <div><h3>Input prompt</h3><pre class="p" tabindex="0" aria-label="Input prompt, log ${id}">${esc(livePrompt(v).replace("{{log}}", () => l.text))}</pre></div>
        <div><h3>Model output · ${esc(nice(a ? a.model : R.actor))}</h3>${out}</div>
      </div>
      <div class="runrow">${a && !running ? `<span class="meta">${esc(metaLine(a))}<br>${esc(seen)}</span>` : "<span></span>"}${runNow("act", v, id, "Run now")}</div>
    </div>`;
  }).join("");
  return `<div class="grid4">${cells}</div>`;
}
const offlineNote = () => R.status === "offline" ? `<div class="note warnnote">These steps call a model for real, and the page is not connected to the server. In a terminal run <code>node server.mjs</code>, then open <code>http://127.0.0.1:8787</code>.</div>` : "";
const retryRow = () => { const errs = Object.values(R.err); return errs.length ? `<div class="row"><span class="bad">${errs.length} call${errs.length > 1 ? "s" : ""} failed: ${esc(errs[0])}</span><button data-act="retry">Retry</button></div>` : ""; };
function scoreNote(v) {
  const js = ALL.filter((l) => l.split !== "test").map((l) => liveJudge(v, l));
  if (js.some((j) => !j || j.right === null)) return `Scoring ${v} for real: ${esc(nice(R.actor))} answers each log, then ${esc(nice(R.grader))} judges whether each reply has the right idea.`;
  const n = js.length, right = js.filter((j) => j.right).length, parsed = js.filter((j) => j.json).length, pass = js.filter((j) => j.json && j.allowed && j.correct).length;
  if (v === "v1") return `Score version 1. The judge, ${esc(nice(R.grader))}, says <b>${right} of ${n}</b> replies name the right failure. The script can parse <b>${parsed} of ${n}</b>, so ${pass} pass all three gates. Gates first: the reply must be JSON, the label must be one we allow, and it must be correct. Any failed gate keeps the score under 0.5.`;
  return `Score version 2. <b>${parsed} of ${n}</b> replies parse and <b>${pass} of ${n}</b> pass all three gates. The judge says ${right} of ${n} have the right idea. Only a reply that passes every gate is scored on quality (here, a reason of 15 words or fewer).`;
}
function detailRow(v, l, j, cols) {
  const a = R.act[v][l.id], g = R.grade[v][l.id], runA = R.busy.has(`a:${v}:${l.id}`), runG = R.busy.has(`g:${v}:${l.id}`);
  const passed = [j.json, j.allowed, j.correct].filter(Boolean).length;
  const how = passed === 3
    ? `All three gates pass, so ${f3(j.score)} = 0.5 + 0.5 × quality (${j.words} words, ${j.words <= 15 ? "within" : "over"} the limit of 15).`

      return `${head("Round 1", "Rule two: logs it has <em>never seen</em>", "The ten validation logs. The Coach saw none of them.", true)}
        <div class="scroll tablebox small" tabindex="0" aria-label="Validation logs, version 2 against version 3"><table class="compact"><thead><tr><th>#</th><th>Log</th><th class="num">Right answer</th><th class="num">v2 json</th><th class="num">v2 right</th><th class="num">v2 score</th><th class="num">v3 json</th><th class="num">v3 right</th><th class="num">v3 score</th></tr></thead><tbody>${compareRows("v2", "v3", ids("val"))}</tbody></table></div>
        <div class="row reveal"><span class="big">validation</span><span class="arrow">&rarr;</span><span>v2 <b>${v2v === null ? "…" : f3(v2v)}</b></span><span>v3 <b>${v3v === null ? "…" : f3(v3v)}</b></span>${winner ? `<span class="ok">winner: ${winner === "v3" ? "version 3" : "version 2"}</span>` : ""}${costLine("v3", ids("val"))}</div>
        ${done ? `<div class="note reveal">${better ? "" : "Rule one dropped version 3, and a dropped candidate stops here in a real loop. We checked it anyway so you can see. "}${winner === "v3" ? "Version 3 also wins on logs the Coach never saw, so the Judge keeps it." : !better && v3v > v2v ? "Version 3 would have won on validation, but rule one dropped it, so the Judge keeps version 2." : "Version 3 does not beat version 2 on validation, so the Judge keeps version 2."}</div>` : ""}${retryRow()}${offlineNote()}`;
    },
  },
  {
    id: "test", title: "The test, once", tag: "live", live: true, steps: 1,
    hints: [["wink", "Ten logs held back. One look."], ["focused", "One look. Then no changes."]],
    notes: "The Teacher kept ten logs sealed: two pipelines the loop never saw. We open them once. If the fence counts on screen show it, say plainly that the gain is mostly a format fix: the Coach found a real bug, but a format bug, and a parser that strips code fences would give a similar jump. Then say the rule out loud: if you change the prompt because of this number, it is not a clean test any more. The winner leaves as a file plus a diff for a person to review.",
    role: (st) => (st === 0 ? "teacher" : ["student", "grader", "judge"]),
    effect: (st) => { needCand(); if (st >= 1 && R.cand.v3) { for (const v of ["v2", "v3"]) for (const set of [MINI, ids("val"), ids("test")]) ensure(v, set, true); } },
    render: (st) => {
      if (st === 0) return `${head("The test", "Ten logs <em>held back</em>", "Two pipelines, kafka-events and beam-telemetry. In round 1 the Coach never saw them and the Judge never used them.", true)}
        <div class="cluster">${ALL.filter((l) => l.split === "test").map(() => `<div class="card sealed"><h3>sealed</h3><p>?</p></div>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="primary" data-act="next">Open the test split (once)</button></div>`;
      if (!R.cand.v3) return `${head("The test", "The test, <em>once</em>")}<div class="note warnnote">${R.status === "live" ? "There is no version 3 yet. Go back three slides: the Coach writes it." : "Version 3 needs the server and the Coach."}</div>${offlineNote()}`;
      const t2 = splitMean("v2", "test"), t3 = splitMean("v3", "test"), v2v = splitMean("v2", "val"), v3v = splitMean("v3", "val");
      const fm = (x) => (x === null ? "…" : f3(x));
      const fenced = (v) => ids("test").filter((id) => R.act[v][id] && R.act[v][id].text.trim().startsWith("```")).length;
      const done = t2 !== null && t3 !== null;
      return `${head("The test", "One look at the <em>test</em>", "", true)}
        <div class="scroll tablebox small tight" tabindex="0" aria-label="Test logs, version 2 against version 3"><table class="compact"><thead><tr><th>#</th><th>Log</th><th class="num">Right answer</th><th class="num">v2 json</th><th class="num">v2 right</th><th class="num">v2 score</th><th class="num">v3 json</th><th class="num">v3 right</th><th class="num">v3 score</th></tr></thead><tbody>${compareRows("v2", "v3", ids("test"))}</tbody></table></div>
        <div class="row reveal"><span>v2 · five <b>${fm(miniMean("v2"))}</b> · val <b>${fm(v2v)}</b> · test <b>${fm(t2)}</b></span><span class="arrow">&rarr;</span><span>v3 · five <b>${fm(miniMean("v3"))}</b> · val <b>${fm(v3v)}</b> · test <b>${fm(t3)}</b></span>${costLine("v3", ids("test"))}</div>
        ${done ? `<div class="note warnnote reveal"><b>${t3 > t2 ? "Version 3 scores higher than version 2 on test." : t3 === t2 ? "Version 3 and version 2 score the same on test." : "Version 3 scores lower than version 2 on test."}</b> ${fenced("v2")} of 10 version 2 replies were code-fenced and failed the JSON gate, against ${fenced("v3")} of 10 for version 3. ${fenced("v2") > fenced("v3") ? "Most of the gain is a format fix." : "The fences do not explain the difference."} Ten logs per split is a toy. This test is now used up: change the prompt because of it and it is no longer clean.</div>` : ""}${retryRow()}${offlineNote()}`;
    },
  },
  {
    id: "loop", title: "Round after round", tag: "live", live: true, steps: 1,
    hints: [["excited", "Round after round, until all 30 pass or the budget ends."], ["thinking", "This is the prompt we keep. Green is what the Coach added."]],
    notes: "The loop from the last six slides, repeated, until one prompt passes all three gates on all 30 logs or five rounds are used. Each round: the Coach reads the failing logs, the Student runs the new prompt on all 30, the Grader marks them, and the Judge accepts the new prompt only if it passes more logs. The Judge's rule changes here, because the goal is now 30 of 30. Say the cost out loud: to pass all 30, the Coach has to read failures from every split, test included. So no log is left unseen, and the final score proves nothing new. To claim it you would hold out a fresh pipeline. Last step: the final prompt, as a diff against version 2.",
    role: () => (R.loop && R.loop.running ? (R.loop.phase === "coach" ? "coach" : ["student", "grader"]) : "judge"),
    effect: () => { needCand(); if (R.cand.v3) runLoop(); },
    render: (st) => {
      const L = R.loop, fm = (x) => (x === null || x === undefined ? "…" : f3(x));
      if (!R.cand.v3) return `${head("Round after round", "Until all <em>30</em> pass")}<div class="note warnnote">${R.status === "live" ? "There is no version 3 yet. Go back four slides: the Coach writes it." : "Version 3 needs the server and the Coach."}</div>${retryRow()}${offlineNote()}`;
      if (!L) return `${head("Round after round", "Until all <em>30</em> pass")}${retryRow()}${offlineNote()}<div class="note">${R.status === "live" ? spinner + "Starting the loop…" : "The loop needs the server."}</div>`;
      if (st === 0) {
        const rows = L.rounds.map((r, n) => `<tr class="reveal"><td class="num">${n + 1}</td><td class="num">${r.v}</td><td class="num">${r.parent}</td><td class="clip" title="${esc(r.lines.join(" / "))}">${esc(r.lines.join(" / ") || "no new line")}</td><td class="num">${fm(r.train)}</td><td class="num">${fm(r.val)}</td><td class="num">${fm(r.test)}</td><td class="num">${r.pass} / 30</td><td class="num" title="${r.cost.calls} calls, about $${r.cost.usd.toFixed(3)}">${fmtN(r.cost.tin)} / ${fmtN(r.cost.tout)}</td><td class="num" title="Sum of the ${r.cost.calls} call times. Four calls run at once, so the wall clock is about a quarter of this.">${fmtMs(r.cost.ms)}</td><td class="${r.status === "accepted" || r.status === "round 1" ? "ok" : "faint"}">${esc(r.status)}${L.final === r.v ? " · final" : ""}</td></tr>`).join("");
        const sum = L.rounds.reduce((t, r) => ({ calls: t.calls + r.cost.calls, ms: t.ms + r.cost.ms, tin: t.tin + r.cost.tin, tout: t.tout + r.cost.tout, usd: t.usd + r.cost.usd }), { calls: 0, ms: 0, tin: 0, tout: 0, usd: 0 });
        const total = L.rounds.length ? `<tr><td colspan="8" class="num"><b>All ${L.rounds.length} round${L.rounds.length === 1 ? "" : "s"}</b>${L.running ? " so far" : ""}</td><td class="num" title="${sum.calls} calls, about $${sum.usd.toFixed(2)}"><b>${fmtN(sum.tin)} / ${fmtN(sum.tout)}</b></td><td class="num"><b>${fmtMs(sum.ms)}</b></td><td class="faint">${sum.calls} calls</td></tr>` : "";
        const cur = L.cur, doneActs = cur ? ALL.filter((l) => R.act[cur] && R.act[cur][l.id]).length : 0;
        const progress = L.running ? `<div class="loader" role="status"><span class="loader-art">${claudeLoader(48)}</span><span>${L.phase === "coach" ? `${esc(nice(R.coachModel) || "The Coach")} is rewriting the prompt…` : `Round ${L.n || 1}: the Student answers the 30 logs with ${esc(cur || "v3")} (${doneActs} of 30), then the Grader marks them`}</span></div>` : "";
        const end = L.state === "done" ? `<div class="note reveal"><b>${esc(L.stop)}</b> The Judge picks the prompt that passes the most: <b>${esc(L.final)}</b>.</div>` : "";
        return `${head("Round after round", L.running ? "The loop <em>runs</em>" : "The loop <em>stopped</em>", "Each round: the Coach reads the failing logs, the Student runs the new prompt on all 30, and the Judge accepts it only if it passes more logs (a tie goes to the higher mean score).", true)}
          <div class="scroll tablebox small" tabindex="0" aria-label="Every round of the loop"><table class="compact"><thead><tr><th class="num">Round</th><th class="num">Prompt</th><th class="num">From</th><th>What the Coach added</th><th class="num">train</th><th class="num">val</th><th class="num">test</th><th class="num">Pass all gates</th><th class="num">Tokens in / out</th><th class="num">Model time</th><th>Judge</th></tr></thead><tbody>${rows}${total}</tbody></table></div>
          <p class="source mono">Model time adds up every call's time. Four calls run at once, so the clock on the wall is about a quarter of it.</p>
          ${progress}${end}${retryRow()}${offlineNote()}`;
      }
      if (L.state !== "done") return `${head("The result", "The prompt we <em>keep</em>")}<div class="note">${L.state === "error" ? "The loop stopped on an error: " + esc(L.stop) : spinner + "The loop is still running. Go back one step to watch it."}</div>${retryRow()}${offlineNote()}`;
      const f = L.final, d = diffSegs(livePrompt("v2"), livePrompt(f));
      const still = failingIds(f, ALL.map((l) => l.id)).map((id) => LOGS.find((l) => l.id === id));
      return `${head("The result", `The prompt we <em>keep</em>: ${esc(f)}`, "", true)}
        <pre class="prompt small fixedp tall reveal" tabindex="0" aria-label="The final prompt, new lines against version 2 in green">${segsHtml(d.segs)}</pre>
        <div class="row reveal"><span>${esc(f)} · train <b>${fm(liveMean(f, "train"))}</b> · val <b>${fm(liveMean(f, "val"))}</b> · test <b>${fm(liveMean(f, "test"))}</b></span><span class="arrow">&rarr;</span><span><b>${passCount(f)} of 30</b> pass all three gates</span></div>
        <div class="note warnnote reveal">${still.length ? `Still failing: ${still.slice(0, 4).map((l) => `log ${l.id} (${esc(l.text.length > 40 ? l.text.slice(0, 40) + "…" : l.text)})`).join(", ")}${still.length > 4 ? ` and ${still.length - 4} more` : ""}. ` : "Every log passes. "}Green is what was added to version 2: ${d.added} line${d.added === 1 ? "" : "s"} new or changed, ${d.removed} dropped. To get here the Coach read failures from every split, test included. <b>That spends the test split:</b> to claim this number you would hold out a fresh pipeline.</div>`;
    },
  },
  {
    id: "checklist", title: "The checklist", tag: null, steps: 0, hints: [["happy", ""]],
    notes: "The closing slide is static: nine cards, one big question. Do not read them. Say thank you, say that is your time, and open for questions. If someone asks what to take away, point at the first, third and last card.",
    render: () => {
      const items = [
        ["Write the gates first", "Hard requirements as pass or fail.", "focused"],
        ["Freeze the examples", "The right answer written next to each.", "thinking"],
        ["Split by source, not by row", "A whole pipeline stays on one side.", "curious"],
        ["Baseline first", "Score the current prompt the same way.", "neutral"],
        ["Decide what counts as better", "Before the run, not after it.", "confused"],
        ["Score the format too", "Length and shape, not only the label.", "worried"],
        ["Record everything", "Model ids, tokens, time, every run.", "happy"],
        ["Code before wording", "A format is a rule to check, not a request.", "wink"],
        ["Look at test once", "And say so if you looked twice.", "surprised"],
      ];
      return `
      ${head("Take this home", "Before you point an optimizer at a <em>prompt</em>", "", true)}
      <div class="tips">${items.map((x) => `<div class="tip reveal"><span class="tipface">${EklavyaMascot.svg({ expression: x[2], variant: "face", size: 52 })}</span><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div></div>`).join("")}</div>
      <div class="bigq reveal">Questions<em>?</em></div>`;
    },
  },
];

/* ---------- navigation ---------- */
const $ = (id) => document.getElementById(id);
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(i, mode) {
  clearInterval(timer);
  S.i = Math.max(0, Math.min(SCREENS.length - 1, i));
  const sc = SCREENS[S.i];
  if (mode === "start") setStep(sc.id, 0);
  else if (mode === "end") setStep(sc.id, sc.steps);
  if (location.hash !== "#" + (S.i + 1)) history.replaceState(null, "", "#" + (S.i + 1));
  draw("screen");
}
function next() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st < sc.steps) { setStep(sc.id, st + 1); draw("step"); }
  else if (S.i < SCREENS.length - 1) go(S.i + 1, "start");
}
function prev() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st > 0) { clearInterval(timer); setStep(sc.id, st - 1); draw(); }
  else if (S.i > 0) go(S.i - 1, "end");
}
// Motion contract. draw(motion): "step" = Next within a screen, only the new elements rise (a prompt's new text, a new card or row);
// "screen" = the whole slide rises once; omitted = redraw with no entrance (Previous, live results, row toggles, Run now).
// Same entrance everywhere: translateY(10px) and fade, 320ms, the token easing. Reduced motion: none.
const MOTION = { ms: 320, ease: "cubic-bezier(.2,.6,.2,1)" }; // mirror --duration-slow and --ease
function draw(motion) {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  const slide = $("slide");
  const before = S.last === sc.id ? slide.getBoundingClientRect() : null;
  const NEW = ".reveal, pre.prompt .add";
  const seen = new Set(motion === "step" ? [...slide.querySelectorAll(NEW)].map((e) => e.outerHTML) : []);
  const tb = slide.querySelector(".tablebox"), tbTop = tb ? tb.scrollTop : 0; // live results redraw the slide; keep the reader's place in the table
  slide.innerHTML = sc.render(st);
  const tb2 = slide.querySelector(".tablebox"); if (tb2) tb2.scrollTop = tbTop;
  slide.querySelectorAll(NEW).forEach((e) => { if (motion !== "step" || seen.has(e.outerHTML)) e.classList.add("still"); });
  if (motion === "screen" && !reduced() && slide.animate) slide.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: MOTION.ms, easing: MOTION.ease });
  // The slide is vertically centred, so adding content moves it. Glide it instead of jumping.
  if (before && !reduced() && slide.animate) {
    const dy = before.top - slide.getBoundingClientRect().top;
    if (Math.abs(dy) > 2) slide.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: MOTION.ms, easing: MOTION.ease });
  }
  if (S.last !== sc.id) $("main").scrollTop = 0;
  S.last = sc.id;
  $("count").textContent = `${String(S.i + 1).padStart(2, "0")} / ${SCREENS.length}`;
  $("crumb").textContent = sc.title;
  $("jump").value = String(S.i);
  const tag = $("tag");
  const tagText = { example: "Example data", live: "Live run", ref: "From the GEPA repo" }[sc.tag] || "";
  tag.hidden = !tagText;
  tag.className = "tag " + (sc.tag || "");
  tag.textContent = tagText;
  $("stepinfo").textContent = sc.steps ? `step ${st} / ${sc.steps}` : "";
  $("prev").disabled = S.i === 0 && st === 0;
  $("next").disabled = S.i === SCREENS.length - 1 && st >= sc.steps;
  document.querySelectorAll(".dot").forEach((d, k) => d.setAttribute("aria-current", String(k === S.i)));
  document.querySelectorAll(".cell .p").forEach((el) => { el.scrollTop = el.scrollHeight; });
  if (S.focusRow) { const b = document.querySelector(`[data-row="${S.focusRow}"] button`); if (b) b.focus(); S.focusRow = null; }
  if (sc.effect) sc.effect(st);
  // The companion: a small face and one short line per step. Hidden on the title, where the full mascot already is.
  const live = $("live");
  live.className = "mono live " + (R.status === "live" ? "on" : R.status === "offline" ? "off" : "");
  live.innerHTML = "<i></i>" + (R.status === "live" ? (R.mode === "replay" ? "Replay · recorded runs" : `Live · ${esc(nice(R.actor))} acts · ${esc(nice(R.grader))} grades`)
    : R.status === "offline" ? "Not connected · run node server.mjs" : "Checking…");
  let hint = sc.hints[Math.min(st, sc.hints.length - 1)];
  if (sc.live && R.busy.size) hint = ["excited", `The model is working. ${R.busy.size} call${R.busy.size > 1 ? "s" : ""} left.`];
  const comp = $("companion");
  comp.hidden = !hint[1];
  // A slide too tall to leave the companion's gap at the bottom drops that gap, so the page does not scroll for nothing. Judged on heights, so it cannot flip back and forth.
  const mainEl = $("main");
  mainEl.classList.toggle("tight", slide.offsetHeight + 24 + 120 > mainEl.clientHeight);
  const crowded = slide.getBoundingClientRect().bottom > innerHeight - 190;
  comp.className = "companion" + (crowded ? " crowded" : "");
  const art = sc.live && R.busy.size ? claudeLoader(64) : EklavyaMascot.svg({ expression: hint[0], variant: "face", size: 56 });
  const hk = sc.id + "|" + hint[1];
  if (hint[1]) comp.innerHTML = `<div class="mascot">${art}</div><div class="bubble${motion && hk !== S.hint ? " reveal" : ""}">${esc(hint[1])}</div>`;
  S.hint = hk;
  // The characters at work on this step: one name, or several when more than one is acting (the Student runs the model while the Grader marks it).
  const rawRole = typeof sc.role === "function" ? sc.role(st) : sc.role;
  const roles = [].concat(rawRole || []).filter(Boolean);
  const roleEl = $("role");
  roleEl.hidden = !roles.length;
  if (roles.length) {
    const rkey = sc.id + "|" + roles.join(",");
    roleEl.className = "role" + (roles.length > 1 ? " many" : "") + (motion && rkey !== S.role ? " reveal" : "");
    roleEl.innerHTML = roles.map((rk) => `<div class="rfig">${stick(rk)}<span>${ROLE_NAME[rk]}</span></div>`).join("");
    S.role = rkey;
  } else { S.role = null; roleEl.innerHTML = ""; }
  const n = $("notes");
  n.hidden = !S.notes;
  n.textContent = sc.notes;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const parts = el.dataset.act.split(":");
  const [act, arg] = parts;
  const id = SCREENS[S.i].id;
  if (act === "next") next();
  else if (act === "goto") { setStep(id, Number(arg)); draw("step"); }
  else if (act === "retry") { if (R.loop && R.loop.running) return; R.err = {}; if (R.loop && R.loop.state === "error") R.loop = null; draw(); }
  else if (act === "rerun") rerun(parts[1], parts[2], Number(parts[3]));
  else if (act === "row") { const key = parts.slice(1).join(":"); S.open.has(key) ? S.open.delete(key) : S.open.add(key); S.focusRow = key; draw(); }
  else if (act === "resetask") { R.confirmReset = true; draw(); }
  else if (act === "resetno") { R.confirmReset = false; draw(); }
  else if (act === "reset") startEmpty();
  else if (act === "warm") warmAll();
  else if (act === "coachnow") { if (!R.busy.size && !(R.loop && R.loop.running)) runCoach(true); }
});
$("prev").addEventListener("click", prev);
$("next").addEventListener("click", next);
$("jump").addEventListener("change", (e) => go(Number(e.target.value)));
SCREENS.forEach((sc, k) => {
  const o = document.createElement("option");
  o.value = String(k); o.textContent = `${k + 1}. ${sc.title}`;
  $("jump").appendChild(o);
  const d = document.createElement("button");
  d.className = "dot"; d.type = "button"; d.setAttribute("aria-label", `Screen ${k + 1}: ${sc.title}`);
  d.addEventListener("click", () => go(k));
  $("dots").appendChild(d);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, "start");
  else if (e.key === "End") go(SCREENS.length - 1, "end");
  else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; draw(); }
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== S.i) go(n - 1); });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
setInterval(() => document.querySelectorAll("[data-since]").forEach((e) => { e.textContent = Math.floor((Date.now() - Number(e.dataset.since)) / 1000) + " s"; }), 1000);
fetch("/api/health").then((r) => (r.ok ? r.json() : Promise.reject(new Error("no server"))))
  .then((j) => { R.status = "live"; R.actor = j.actor; R.grader = j.grader; R.coachModel = j.coach; R.mode = j.mode; R.recorded = j.recorded; redraw(); })
  .catch(() => { R.status = "offline"; redraw(); });
</script>
