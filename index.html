<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Engineering for Prompt Optimization</title>

<!-- Design tokens and the archer mascot, inlined by build.py so this page stays one file.
     Only the web fonts are fetched; offline, the stacks fall back to system faces. -->
<style>
/* ============================================================
   Eklavya design tokens.

   Two layers, and the order matters:

   1. A SCALE — accent ramp, type, spacing, radii, motion. Fixed
      values that mean the same thing on every ground.
   2. GROUNDS — `ink` (default) and `paper`, each redefining the
      same set of ROLE tokens. Components must only ever name a
      role (--ink, --dim, --line, --spot). Naming a scale step or
      a raw hex in a component is a bug: it pins that component to
      one ground and the theme toggle stops working for it.

   The ground is set as data-mode on <html> by a blocking inline
   script in each page's <head>, before this file loads. Custom
   properties inherit, so flipping that one attribute re-resolves
   every role for the whole tree.

   Ink is the default and `auto` resolves to ink. That is a
   presentation decision, deliberately not the reader's OS setting:
   Eklavya is a terminal plugin and the dark ground is the product.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* ---------- ACCENT: verdigris ----------
     Aged bronze on a bow fitting. One hue, spent sparingly. The
     ground blocks below pick which step is --spot; these steps are
     for the rare tint or border that needs a specific value. */
  --vd-50:  #E6F7F3;
  --vd-100: #C4EDE4;
  --vd-200: #9BE0D2;
  --vd-300: #79D5C4; /* accent on ink   — 10.33:1 */
  --vd-400: #3FB8A3;
  --vd-500: #199688;
  --vd-600: #0E6E66;
  --vd-700: #0A5751; /* accent on paper — 7.20:1 on the ground, 5.10:1 on a tint */
  --vd-800: #07403C;
  --vd-900: #052E2B;

  /* ---------- MASCOT IDENTITY ----------
     Archer Cloak artwork keeps its approved identity across both grounds.
     UI chrome continues to use the surface, text and accent roles below. */
  --mascot-coral: #ef9875;
  --mascot-coral-dark: #c96d51;
  --mascot-highlight: #ffc8a6;
  --mascot-cloak: #0E6E66;
  --mascot-cloak-dark: #07403C;
  --mascot-thread: #C4EDE4;
  --mascot-ink: #302c2a;
  --mascot-metal: #5b7c73;
  --mascot-wood: #bc9569;
  --mascot-wood-dark: #74583f;
  --mascot-string: #EAE7E1;
  --mascot-shadow: #26262a;
  /* ---------- END MASCOT IDENTITY ---------- */

  /* ---------- SEMANTIC (real errors and warnings only) ----------
     Kept off the accent hue so state never reads as branding. --warning and
     --error are redefined per ground below: an orange that carries on ink is
     2.3:1 on cream, which fails as text and as a chart fill alike. */
  --info:    #4A9EFF;

  /* ---------- TYPE FAMILIES ----------
     Two extremes, no middle: enormous tight display, tiny wide-
     tracked uppercase mono. Body text stays small and quiet. */
  --font-disp: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* ---------- TYPE SCALE ---------- */
  --text-xs:   12px;  --lh-xs:   16px;
  --text-sm:   14px;  --lh-sm:   20px;
  --text-base: 16px;  --lh-base: 24px;
  --text-md:   18px;  --lh-md:   28px;
  --text-lg:   20px;  --lh-lg:   28px;
  --text-xl:   24px;  --lh-xl:   32px;
  --text-2xl:  30px;  --lh-2xl:  38px;
  --text-3xl:  38px;  --lh-3xl:  46px;
  --text-4xl:  48px;  --lh-4xl:  56px;
  --text-5xl:  60px;  --lh-5xl:  66px;

  /* Display sizes are fluid — they set the page's confidence, and a
     fixed 40px hero reads timid on a wide screen. */
  --display-hero: clamp(38px, 6.4vw, 120px);
  --display-1:    clamp(34px, 4.6vw, 68px);
  --display-2:    clamp(28px, 3.2vw, 44px);

  --weight-regular: 400;
  --weight-medium:  500;
  --weight-semibold:600;
  --weight-bold:    800;
  --weight-extra:   900;

  /* Display tracking is aggressively negative — this, plus the
     sub-1 leading, is most of what reads as "designed". */
  --tracking-display: -0.055em;
  --tracking-tight:   -0.045em;
  --tracking-snug:    -0.02em;
  --tracking-normal:  0;
  --tracking-caps:    0.16em;
  --tracking-caps-wide: 0.24em;

  --leading-display: 0.9;

  /* ---------- SPACING (4px base) ---------- */
  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;
  --space-5: 20px;  --space-6: 24px;  --space-8: 32px;  --space-10: 40px;
  --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-24: 96px;

  --gut: 34px;   /* frame gutter */
  --max: 1440px; /* frame width  */

  /* ---------- RADII ----------
     The chrome is square: hairline rules, not rounded cards. The
     showpieces keep their own geometry — see --radius-term. */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-pill: 999px;
  --radius-term: 16px; /* the hero terminal and the arrow scene only */

  /* ---------- MOTION ----------
     Consumed by the arrow flight and the terminal loop. Do not
     retime these without re-checking both. */
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
  --ease: cubic-bezier(.2,.6,.2,1);
}

/* ============================================================
   GROUNDS
   Every role below exists in both blocks. A role defined in only
   one of them renders one ground's text on the other's surface.
   ============================================================ */

:root,
:root[data-mode="ink"] {
  --bg:       #17171a; /* page */
  /* The mascot hero deliberately keeps its ink ground in either theme. */
  --hero-bg: #17171a;
  --hero-panel: #1e1e22;
  --hero-ink: #EAE7E1;
  --hero-dim: #A29C93;
  --hero-spot: #79D5C4;
  --hero-line: #33333a;
  --panel:    #1e1e22; /* raised band, sidebar */
  --mass:     #26262a; /* wells, inline code */

  --ink:      #EAE7E1; /* primary text */
  --dim:      #A29C93; /* secondary */
  --faint:    #8B857B; /* captions, micro-labels — 4.89:1 on ink */
  --faint-2:  #565249; /* disabled, placeholder */

  --line:     #26262a; /* hairline */
  --line-2:   #33333a; /* stronger hairline, frame edges */

  --spot:     var(--vd-300);
  --spot-ink: #17171a; /* text ON a --spot fill */
  --spot-soft: color-mix(in srgb, var(--spot) 14%, transparent);
  --warning-soft: color-mix(in srgb, var(--warning) 14%, transparent);

  --grid:     #1f1f23; /* background rule grid */
  --glow:     rgba(25,150,136,.22);  /* the terminal's halo */
  --glow-low: rgba(25,150,136,.10);
  --shot-op:  .28;                   /* the arrow scene, as ambient art */
  --warning:  #E8920C;
  --error:    #FF6166;               /* 4.82:1 on its own 12% tint over --panel */
  --code-bg:  var(--mass);           /* the well behind a code block */
  --code-str: #E6C060;               /* strings in an artifact's code — 9.55:1 on --panel */
  --code-num: #D4A5F5;               /* numbers and literals — 8.31:1 on --panel */
  /* Diagram categories (explainer artifacts only). Ink: 4.5:1 or more on --panel and --mass. Colour names a group, always with a text label. */
  --viz-1: #79D5C4; /* teal */
  --viz-1-soft: color-mix(in srgb, var(--viz-1) 16%, transparent);
  --viz-2: #F0B14A; /* amber */
  --viz-2-soft: color-mix(in srgb, var(--viz-2) 16%, transparent);
  --viz-3: #7FB2F5; /* blue */
  --viz-3-soft: color-mix(in srgb, var(--viz-3) 16%, transparent);
  --viz-4: #B79CF2; /* violet */
  --viz-4-soft: color-mix(in srgb, var(--viz-4) 16%, transparent);
  --viz-5: #F28FA8; /* rose */
  --viz-5-soft: color-mix(in srgb, var(--viz-5) 16%, transparent);
  --shadow-lg: 0 12px 28px rgba(0,0,0,.45);
  --ring:     0 0 0 2px var(--bg), 0 0 0 4px var(--spot);
}

:root[data-mode="paper"] {
  --bg:       #f0ede6;
  --hero-bg: #17171a;
  --hero-panel: #1e1e22;
  --hero-ink: #EAE7E1;
  --hero-dim: #A29C93;
  --hero-spot: #79D5C4;
  --hero-line: #33333a;
  --panel:    #e7e3da;
  --mass:     #ddd8cc;

  --ink:      #16150f;
  --dim:      #57534a;
  --faint:    #635E52; /* 5.04:1 on --panel, the darkest ground it sits on */
  --faint-2:  #a09a8c;

  --line:     #e3dfd4;
  --line-2:   #cec8b9;

  --spot:     var(--vd-700);
  --spot-ink: #ffffff;
  --spot-soft: color-mix(in srgb, var(--spot) 10%, transparent);
  --warning-soft: color-mix(in srgb, var(--warning) 10%, transparent);

  --grid:     #e5e1d7;
  /* a light ground carries far less glow before it reads as a stain, and
     line art needs more weight on it than it does on ink */
  --glow:     rgba(14,110,102,.10);
  --glow-low: rgba(14,110,102,.05);
  --shot-op:  .5;
  --warning:  #7A4B00;               /* 5.21:1 on --mass */
  --error:    #A8201A;               /* 4.70:1 on its own 12% tint over --panel */
  /* A syntax theme's dimmest token (comments) lands at 3.9:1 on --mass. The
     well is lightened rather than the theme repainted, which lifts every
     token at once; the frame's border is what still reads it as a block. */
  --code-bg:  #EDEAE2;
  --code-str: #6F5300;               /* 5.63:1 on --panel */
  --code-num: #6B3FA0;               /* 5.77:1 on --panel */
  /* Diagram categories (explainer artifacts only). Paper: 4.5:1 or more on --panel and --mass. Colour names a group, always with a text label. */
  --viz-1: #0A5751; /* teal */
  --viz-1-soft: color-mix(in srgb, var(--viz-1) 12%, transparent);
  --viz-2: #7F4A00; /* amber */
  --viz-2-soft: color-mix(in srgb, var(--viz-2) 12%, transparent);
  --viz-3: #1D4F9C; /* blue */
  --viz-3-soft: color-mix(in srgb, var(--viz-3) 12%, transparent);
  --viz-4: #5B3DB0; /* violet */
  --viz-4-soft: color-mix(in srgb, var(--viz-4) 12%, transparent);
  --viz-5: #A32D55; /* rose */
  --viz-5-soft: color-mix(in srgb, var(--viz-5) 12%, transparent);
  --shadow-lg: 0 12px 28px rgba(22,21,15,.10);
  --ring:     0 0 0 2px var(--bg), 0 0 0 4px var(--spot);
}

/* ============================================================
   THE TERMINAL
   The hero terminal is a picture of a terminal, and terminals are
   dark — so it keeps one palette on both grounds rather than
   flipping. These are the only colours on the site that do not
   follow the ground, and that is deliberate.
   ============================================================ */
:root {
  --term-bg:     #121215;
  --term-chrome: #1c1c20;
  --term-line:   #2b2b31;
  --term-text:   #C8CDD4;
  --term-dim:    #96939B;
  --term-bright: #FFFFFF;
  --term-claude: #D97757;
  --term-spot:   var(--vd-300);
  --term-cmd:    #8ECF7A;
  --term-str:    #E6C060;
  --term-err:    #FF6166;
}

</style>
<style>
/* Identity colours and UI surfaces use Eklavya's semantic tokens. */
eklavya-mascot { display:inline-flex; flex-shrink:0; vertical-align:middle; line-height:0; }
.ek-mascot { display:block; overflow:visible; flex-shrink:0; }
.ek-mascot[data-variant="face"] { overflow:hidden; }
.ek-mascot__face path:not([fill]) { fill:none; }
.ek-mascot--loading .ek-mascot__character { animation:ek-breathe 2.8s ease-in-out infinite; transform-origin:95px 185px; }
.ek-mascot--loading .ek-mascot__arrow { animation:ek-release 2.8s cubic-bezier(.3,0,.3,1) infinite; }
.ek-mascot--loading .ek-mascot__string { animation:ek-draw 2.8s ease-in-out infinite; transform-origin:157px 125px; }
.ek-mascot--loading .ek-mascot__ripple { animation:ek-hit 2.8s ease-out infinite; transform-origin:196px 128px; opacity:0; }
@keyframes ek-breathe { 0%,100% {transform:translateY(0)} 35%,55% {transform:translateY(-3px) rotate(-1deg)} }
@keyframes ek-release { 0%,12% {transform:translateX(0);opacity:1} 40%,52% {transform:translateX(-10px);opacity:1} 68% {transform:translateX(22px);opacity:0} 69%,85% {transform:translateX(0);opacity:0} 100% {transform:translateX(0);opacity:1} }
@keyframes ek-draw { 0%,100% {transform:scaleX(1)} 40%,52% {transform:scaleX(1.11)} 60% {transform:scaleX(.08)} 68% {transform:scaleX(1)} }
@keyframes ek-hit { 0%,60%,100% {opacity:0;transform:scale(.4)} 68% {opacity:.8;transform:scale(.7)} 88% {opacity:0;transform:scale(1.7)} }
.ek-companion { display:flex;align-items:center;gap:12px;color:var(--dim);font:13px/1.5 var(--font-body); }
.ek-companion--hero { margin-bottom:16px; }
.ek-companion--hero b { display:block;color:var(--ink);font-weight:600; }
.ek-mascot-message { display:flex;align-items:center;gap:16px;padding:16px 0; }
.ek-mascot-message p {margin:0}
@media (prefers-reduced-motion:reduce) { .ek-mascot * {animation:none !important;transition:none !important} }

.ek-companion--rail { padding:12px 20px; text-decoration:none; }
.ek-mascot-message > :last-child { min-width:0; overflow-wrap:break-word; }
.ek-mascot-status { display:inline-flex; align-items:center; gap:6px; }

</style>
<style>
  :root {
    --boxh: min(360px, calc(126px + max(0px, (100vh - 800px) * 0.3)));       /* run-grid boxes: 126px at 800px tall, taller on a bigger window */
    --detailh: min(520px, calc(300px + max(0px, (100vh - 800px) * 0.4)));    /* boxes in an opened score row */
    --monosz: clamp(12px, 0.9vw, 17px);                                      /* text inside those boxes */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: clamp(16px, 1.3vw, 20px); line-height: 1.6;
    display: flex; flex-direction: column; overflow: hidden;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  header, footer { display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: var(--bg); border-color: var(--line-2); }
  header { border-bottom: 1px solid var(--line-2); }
  footer { border-top: 1px solid var(--line-2); }
  .logo { height: 26px; width: auto; display: block; flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-size: 0.72em; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--faint); }
  .crumb { flex: 1; color: var(--dim); font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 0;
    padding: 6px 10px; font: inherit; font-size: 0.75em; max-width: 40vw;
  }
  main { flex: 1; min-height: 0; overflow: auto; padding: 24px 24px 120px; outline: none; }
  .stage { min-height: 100%; display: flex; flex-direction: column; }
  .slide { margin: auto; width: 100%; max-width: min(1500px, calc(100vw - 168px)); } /* leaves a gutter for the corner companion */
  .head { text-align: center; margin-bottom: 28px; }
  h1, h2, h3 { font-family: var(--font-disp); margin: 0; }
  h1 { font-size: var(--display-1); line-height: 0.98; letter-spacing: var(--tracking-tight); font-weight: 900; }
  h2 { font-size: var(--display-2); line-height: 1.05; letter-spacing: var(--tracking-tight); font-weight: 900; }
  h3 { font-size: 0.7em; font-family: var(--font-mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--spot); font-weight: 600; margin-bottom: 8px; }
  em { font-style: normal; color: var(--spot); }
  p { margin: 0 0 12px; color: var(--dim); }
  .lede { font-size: 1.05em; color: var(--dim); max-width: 40em; margin: 12px auto 0; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.7em; letter-spacing: var(--tracking-caps-wide); text-transform: uppercase; color: var(--spot); margin-bottom: 12px; }
  .cluster { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .cluster > * { flex: 1 1 260px; max-width: 360px; }
  .cluster.wide > * { max-width: 520px; flex-basis: 340px; }
  .card { background: var(--panel); border: 1px solid var(--line-2); padding: 16px 18px; }
  .card ul { margin: 0; padding-left: 1.1em; color: var(--dim); }
  .card li { margin-bottom: 6px; }
  .card p:last-child { margin-bottom: 0; }
  .block { width: fit-content; min-width: min(560px, 100%); max-width: 100%; margin: 0 auto 16px; }
  pre.prompt {
    margin: 0 auto 16px; padding: 16px 20px; background: var(--code-bg); border: 1px solid var(--line-2);
    font-family: var(--font-mono); font-size: 0.8em; line-height: 1.6; white-space: pre-wrap; color: var(--ink);
    width: fit-content; min-width: min(560px, 100%); max-width: 100%;
  }
  pre.prompt .add { background: var(--spot-soft); outline: 1px solid var(--spot); }
  pre.prompt .var { color: var(--code-str); }
  pre.term {
    margin: 0 auto 16px; padding: 14px 18px; background: var(--term-bg); border: 1px solid var(--term-line); color: var(--term-text);
    font-family: var(--font-mono); font-size: 0.8em; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
    width: fit-content; min-width: min(560px, 100%); max-width: 100%;
  }
  pre.term .p { color: var(--term-spot); } pre.term .c { color: var(--term-dim); } pre.term .s { color: var(--term-str); } pre.term .k { color: var(--term-cmd); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 0.8em; cursor: pointer; color: var(--ink); border-radius: 0;
    background: var(--panel); border: 1px solid var(--line-2); padding: 8px 16px;
    transition: border-color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease);
  }
  button:hover:not([disabled]) { border-color: var(--spot); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }
  button.primary { background: var(--spot); border-color: var(--spot); color: var(--spot-ink); font-weight: 700; }
  button.primary:hover:not([disabled]) { background: var(--ink); border-color: var(--ink); }
  button.tab { padding: 5px 12px; font-size: 0.75em; }
  button.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  button[disabled] { opacity: 0.4; cursor: default; }
  a { color: var(--spot); }
  .tcard { text-align: left; display: block; width: 100%; padding: 12px 14px; }
  .tcard b { display: block; color: var(--ink); margin-bottom: 4px; font-family: var(--font-disp); font-weight: 800; }
  .tcard span { display: block; color: var(--dim); font-size: 0.78em; line-height: 1.45; }
  .tcard .state { font-family: var(--font-mono); font-size: 0.62em; letter-spacing: var(--tracking-caps); text-transform: uppercase; margin-bottom: 6px; color: var(--faint); }
  .tcard.done, .tcard.done[disabled] { border-color: var(--spot); background: var(--spot-soft); opacity: 1; }
  .tcard.done .state { color: var(--spot); }
  .tcard.active { border-color: var(--spot); }
  .tcard.active .state { color: var(--spot); }
  .tcard.locked { opacity: 0.4; cursor: default; }
  .shelf { margin-top: 20px; }
  .shelf > * { flex-basis: 170px; max-width: 230px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78em; margin-bottom: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  th { color: var(--faint); font-weight: 600; font-family: var(--font-mono); font-size: 0.82em; text-transform: uppercase; letter-spacing: var(--tracking-caps); }
  td.num, th.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
  td.log { font-family: var(--font-mono); font-size: 0.92em; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 8px; font-family: var(--font-mono); font-size: 0.78em; border: 1px solid var(--line-2); color: var(--dim); }
  .pill.train { border-color: var(--spot); color: var(--spot); }
  .pill.val { border-color: var(--warning); color: var(--warning); }
  .pill.test { border-color: var(--error); color: var(--error); }
  .chip { display: inline-block; padding: 3px 10px; margin: 0 6px 6px 0; font-family: var(--font-mono); font-size: 0.74em; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); }
  .ok { color: var(--spot); } .bad { color: var(--error); } .warn { color: var(--warning); } .faint { color: var(--faint); }
  .note { max-width: 46em; margin: 16px auto; padding: 8px 16px; color: var(--ink); background: var(--spot-soft); border-left: 3px solid var(--spot); }
  .note.warnnote { border-color: var(--warning); background: var(--warning-soft); }
  .note.top { margin: 0 auto 12px; }
  .placeholder { max-width: 46em; margin: 16px auto 0; border: 1px dashed var(--faint); padding: 12px 16px; color: var(--faint); }
  .source { text-align: center; margin-top: 16px; }
  .big { font-family: var(--font-mono); font-size: 1.4em; color: var(--ink); }
  .arrow { color: var(--faint); padding: 0 6px; }
  .tag { font-family: var(--font-mono); font-size: 0.68em; letter-spacing: var(--tracking-caps); text-transform: uppercase; padding: 3px 10px; border: 1px solid var(--line-2); color: var(--faint); }
  .tag.example { color: var(--warning); border-color: var(--warning); }
  .tag.real { color: var(--spot); border-color: var(--spot); }
  .tag.ref { color: var(--ink); border-color: var(--ink); }
  .stepinfo { min-width: 6em; }
  .dots { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1px solid var(--faint); background: transparent; }
  .dot[aria-current="true"] { background: var(--spot); border-color: var(--spot); }
  .notes { position: fixed; right: 16px; top: 64px; max-width: 360px; background: var(--panel); border: 1px solid var(--spot); padding: 12px 14px; font-size: 0.78em; color: var(--ink); z-index: 5; }
  .notes[hidden] { display: none; }
  .companion { position: fixed; left: 24px; bottom: 76px; display: flex; align-items: flex-end; gap: 10px; max-width: min(440px, 62vw); z-index: 4; pointer-events: none; }
  .companion[hidden] { display: none; }
  .companion.crowded .bubble { display: none; }
  .bubble { background: var(--panel); border: 1px solid var(--line-2); padding: 8px 14px; font-size: 0.78em; color: var(--ink); line-height: 1.45; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live.on i { background: var(--spot); }
  .live.on { color: var(--dim); }
  .live.off i { background: var(--warning); }
  .live.off { color: var(--warning); }
  .tag.live { color: var(--spot); border-color: var(--spot); }
  .clickable { cursor: pointer; }
  .clickable:hover td { background: var(--spot-soft); }
  .rowbtn { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: inherit; font: inherit; }
  .rowbtn .chev { color: var(--faint); transition: transform var(--duration-fast) var(--ease); }
  .rowbtn[aria-expanded="true"] .chev { transform: rotate(90deg); color: var(--spot); }
  .compact .detail td { white-space: normal; max-width: none; background: var(--panel); padding: 12px; }
  .dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: left; font-size: 1.05em; }
  .dbox h3 { margin-bottom: 6px; }
  .dbox pre { margin: 0; padding: 10px; background: var(--code-bg); border: 1px solid var(--line-2); font-family: var(--font-mono); font-size: var(--monosz); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; height: var(--detailh); overflow: auto; color: var(--ink); }
  .dbox p { margin: 0 0 8px; color: var(--dim); font-size: 1em; }
  .dbox .meta { display: block; margin-top: 6px; font-family: var(--font-mono); font-size: 0.85em; color: var(--faint); }
  .dbox .why { color: var(--ink); font-style: normal; }
  @media (max-width: 900px) { .dgrid { grid-template-columns: 1fr; } }
  .runrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .runrow .meta { margin: 0; flex: 1 1 14em; }
  .runnow { white-space: nowrap; }
  .boxfix { margin: 0; display: grid; place-items: center; background: var(--code-bg); border: 1px solid var(--line-2); }
  .dbox .boxfix { height: var(--detailh); }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; color: var(--dim); font-size: 0.85em; text-align: center; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--spot); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-art { display: block; }
  .claude-loader { display: block; }
  .claude-loader svg { display: block; width: 100%; height: auto; }
  .claude-loader .cl-body { animation: cl-bob 0.9s steps(1) infinite; }
  .claude-loader .cl-arm-l { animation: cl-hop 0.45s steps(1) infinite; }
  .claude-loader .cl-arm-r { animation: cl-hop 0.45s steps(1) infinite 0.225s; }
  .claude-loader .cl-leg-a { animation: cl-hop 0.6s steps(1) infinite; }
  .claude-loader .cl-leg-b { animation: cl-hop 0.6s steps(1) infinite 0.3s; }
  .claude-loader .cl-eye { animation: cl-blink 3.2s steps(1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes cl-bob { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes cl-hop { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes cl-blink { 0%, 94% { transform: scaleY(1); } 95%, 100% { transform: scaleY(0.2); } }
  .loader .elapsed { color: var(--faint); }
  .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; text-align: left; }
  .cell { background: var(--panel); border: 1px solid var(--line-2); padding: 8px 12px 10px; min-width: 0; }
  .cellhead { font-size: 0.8em; color: var(--dim); margin-bottom: 2px; }
  .cellhead b { color: var(--ink); font-family: var(--font-disp); font-weight: 800; }
  .cellbody { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 8px; }
  .cell h3 { font-size: 0.62em; margin: 6px 0 4px; }
  .cell pre { margin: 0; height: var(--boxh); overflow: auto; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line-2); font-family: var(--font-mono); font-size: var(--monosz); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .cell .boxfix { height: var(--boxh); }
  .cell .loader { padding: 4px; font-size: 0.78em; gap: 2px; }
  .cell .runrow { margin-top: 6px; }
  .cell .meta { display: block; font-family: var(--font-mono); font-size: 0.7em; color: var(--faint); }
  @media (max-width: 900px) { .grid4, .cellbody { grid-template-columns: 1fr; } .cell pre, .cell .boxfix { height: 130px; } }
  .head.dense { margin-bottom: 14px; }
  .head.dense h2 { font-size: clamp(24px, 2.4vw, 34px); }
  .head.dense .eyebrow { margin-bottom: 6px; }
  pre.prompt.small { font-size: 0.72em; line-height: 1.5; padding: 12px 16px; }
  .compact { font-size: 0.72em; }
  .compact th, .compact td { padding: 4px 8px; }
  .compact td.log { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.checks { margin: 0 auto; padding-left: 1.3em; color: var(--dim); max-width: 44em; }
  ol.checks li { margin-bottom: 8px; }
  ol.checks b { color: var(--ink); }
  .scroll { overflow-x: auto; }
  .tablebox { max-height: calc(100vh - 460px); overflow: auto; } .tablebox.scored { max-height: calc(100vh - 590px); } /* 30 rows: a fixed-size scrollable box, not a page scroll */
  .tablebox thead th { position: sticky; top: 0; background: var(--bg); z-index: 1; }
  /* GEPA screens: stick figures and the cast of the loop */
  .stick { height: clamp(96px, 15vh, 170px); width: auto; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; overflow: visible; }
  .flow .col { display: flex; flex-direction: column; gap: 10px; }
  .flow { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
  .pcard { border: 1px solid var(--line-2); background: var(--panel); padding: 10px 16px; font-size: 0.9em; max-width: 17em; text-align: left; }
  .pcard .k { display: block; font-family: var(--font-mono); font-size: 0.72em; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  .pcard.new, .pcard.good { border-color: var(--spot); } .pcard.bad { border-color: var(--error); color: var(--error); }
  .gbox { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-mono); color: var(--spot); }
  .stack { display: flex; align-items: stretch; justify-content: center; gap: 12px; flex-wrap: wrap; } .stack .pcard { width: 13em; display: flex; flex-direction: column; justify-content: center; } .stack .arrow { align-self: center; }
  .bignum { font-family: var(--font-mono); font-size: 2.4em; margin: 0; color: var(--ink); }
  .chiprow { text-align: center; margin-top: 8px; }
  .cluster.two .card { flex: 1 1 300px; }
  .cast { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .member { flex: 1 1 170px; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 12px; border: 1px solid var(--line-2); background: var(--panel); text-align: center; }
  .member.on { border-color: var(--spot); }
  .member .stick { height: clamp(84px, 12vh, 140px); }
  .member h3 { margin: 4px 0 0; }
  .member .job { color: var(--ink); font-size: 0.88em; margin: 0; }
  .member .gterm { color: var(--dim); font-size: 0.82em; margin: 4px 0 0; padding-top: 8px; border-top: 1px solid var(--line-2); width: 100%; }
  .member .gterm span { display: block; font-family: var(--font-mono); font-size: 0.8em; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--spot); margin-bottom: 2px; }
  .loopback { position: relative; height: 28px; margin: 0 8%; border: 2px solid var(--spot); border-top: 0; text-align: center; }
  .loopback .chip { position: relative; top: 14px; background: var(--bg); margin: 0; }
  /* Motion contract (.claude/rules/slides.md): one entrance, `rise`. Only what is new animates; `still` marks what was already there. */
  .reveal { animation: rise var(--duration-slow) var(--ease); }
  pre.prompt .add { animation: rise var(--duration-slow) var(--ease); }
  .still, pre.prompt .add.still { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) { .companion { max-width: 78vw; } .bubble { font-size: 0.72em; } main { padding-bottom: 130px; } .crumb { display: none; } .live { font-size: 0; gap: 0; } header label { display: none; } .count { min-width: 0; white-space: nowrap; } header { gap: 10px; padding: 10px 14px; } header select { flex: 1; max-width: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

function ensure(v, ids, withGrade) {

  const jobs = [];
  for (const id of ids) {
    const log = LOGS.find((l) => l.id === id), ka = `a:${v}:${id}`, kg = `g:${v}:${id}`;
    const needAct = !R.act[v][id] && !R.busy.has(ka) && !R.err[ka];
    const needGrade = withGrade && !R.grade[v][id] && !R.busy.has(kg) && !R.err[kg] && (R.act[v][id] || needAct);
    if (!needAct && !needGrade) continue;
    if (needAct) busyAdd(ka);

    jobs.push(async () => {
      if (needAct) {
        try { R.act[v][id] = await api("/api/act", { prompt: livePrompt(v).replace("{{log}}", log.text) }); } catch (e) { R.err[ka] = String(e.message || e); }

/* ---------- navigation ---------- */
const $ = (id) => document.getElementById(id);
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(i, mode) {
  clearInterval(timer);
  S.i = Math.max(0, Math.min(SCREENS.length - 1, i));
  const sc = SCREENS[S.i];
  if (mode === "start") setStep(sc.id, 0);
  else if (mode === "end") setStep(sc.id, sc.steps);
  if (location.hash !== "#" + (S.i + 1)) history.replaceState(null, "", "#" + (S.i + 1));
  draw("screen");
}
function next() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st < sc.steps) { setStep(sc.id, st + 1); draw("step"); }
  else if (S.i < SCREENS.length - 1) go(S.i + 1, "start");
}
function prev() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st > 0) { clearInterval(timer); setStep(sc.id, st - 1); draw(); }
  else if (S.i > 0) go(S.i - 1, "end");
}
// Motion contract. draw(motion): "step" = Next within a screen, only the new elements rise (a prompt's new text, a new card or row);
// "screen" = the whole slide rises once; omitted = redraw with no entrance (Previous, live results, row toggles, Run now).
// Same entrance everywhere: translateY(10px) and fade, 320ms, the token easing. Reduced motion: none.
const MOTION = { ms: 320, ease: "cubic-bezier(.2,.6,.2,1)" }; // mirror --duration-slow and --ease
function draw(motion) {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  const slide = $("slide");
  const before = S.last === sc.id ? slide.getBoundingClientRect() : null;
  const NEW = ".reveal, pre.prompt .add";
  const seen = new Set(motion === "step" ? [...slide.querySelectorAll(NEW)].map((e) => e.outerHTML) : []);
  const tb = slide.querySelector(".tablebox"), tbTop = tb ? tb.scrollTop : 0; // live results redraw the slide; keep the reader's place in the table
  slide.innerHTML = sc.render(st);
  const tb2 = slide.querySelector(".tablebox"); if (tb2) tb2.scrollTop = tbTop;
  slide.querySelectorAll(NEW).forEach((e) => { if (motion !== "step" || seen.has(e.outerHTML)) e.classList.add("still"); });
  if (motion === "screen" && !reduced() && slide.animate) slide.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: MOTION.ms, easing: MOTION.ease });
  // The slide is vertically centred, so adding content moves it. Glide it instead of jumping.
  if (before && !reduced() && slide.animate) {
    const dy = before.top - slide.getBoundingClientRect().top;
    if (Math.abs(dy) > 2) slide.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: MOTION.ms, easing: MOTION.ease });
  }
  if (S.last !== sc.id) $("main").scrollTop = 0;
  S.last = sc.id;
  $("count").textContent = `${String(S.i + 1).padStart(2, "0")} / ${SCREENS.length}`;
  $("crumb").textContent = sc.title;
  $("jump").value = String(S.i);
  const tag = $("tag");
  const tagText = { example: "Example data", live: "Live run", ref: "From the GEPA repo" }[sc.tag] || "";
  tag.hidden = !tagText;
  tag.className = "tag " + (sc.tag || "");
  tag.textContent = tagText;
  $("stepinfo").textContent = sc.steps ? `step ${st} / ${sc.steps}` : "";
  $("prev").disabled = S.i === 0 && st === 0;
  $("next").disabled = S.i === SCREENS.length - 1 && st >= sc.steps;
  document.querySelectorAll(".dot").forEach((d, k) => d.setAttribute("aria-current", String(k === S.i)));
  document.querySelectorAll(".cell .p").forEach((el) => { el.scrollTop = el.scrollHeight; });
  if (S.focusRow) { const b = document.querySelector(`[data-row="${S.focusRow}"] button`); if (b) b.focus(); S.focusRow = null; }
  if (sc.effect) sc.effect(st);
  // The companion: a small face and one short line per step. Hidden on the title, where the full mascot already is.
  const live = $("live");
  live.className = "mono live " + (R.status === "live" ? "on" : R.status === "offline" ? "off" : "");
  live.innerHTML = "<i></i>" + (R.status === "live" ? (R.mode === "replay" ? "Replay · recorded runs" : `Live · ${esc(nice(R.actor))} acts · ${esc(nice(R.grader))} grades`)
    : R.status === "offline" ? "Not connected · run node server.mjs" : "Checking…");
  let hint = sc.hints[Math.min(st, sc.hints.length - 1)];
  if (sc.live && R.busy.size) hint = ["excited", `The model is working. ${R.busy.size} call${R.busy.size > 1 ? "s" : ""} left.`];
  const comp = $("companion");
  comp.hidden = !hint[1];
  const crowded = slide.getBoundingClientRect().bottom > innerHeight - 190;
  comp.className = "companion" + (crowded ? " crowded" : "");
  const art = sc.live && R.busy.size ? claudeLoader(64) : EklavyaMascot.svg({ expression: hint[0], variant: "face", size: 56 });
  const hk = sc.id + "|" + hint[1];
  if (hint[1]) comp.innerHTML = `<div class="mascot">${art}</div><div class="bubble${motion && hk !== S.hint ? " reveal" : ""}">${esc(hint[1])}</div>`;
  S.hint = hk;
  const n = $("notes");
  n.hidden = !S.notes;
  n.textContent = sc.notes;
}
function animateTo(max) {
  clearInterval(timer);
  const id = SCREENS[S.i].id;
  timer = setInterval(() => {
    if (SCREENS[S.i].id !== id) { clearInterval(timer); return; }
    const n = stepOf(id) + 1;
    setStep(id, n); draw("step");
    if (n >= max) clearInterval(timer);
  }, 650);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const parts = el.dataset.act.split(":");
  const [act, arg] = parts;
  const id = SCREENS[S.i].id;
  if (act === "next") next();
  else if (act === "goto") { setStep(id, Number(arg)); draw("step"); }
  else if (act === "run1") { setStep(id, 1); draw("step"); animateTo(4); }
  else if (act === "retry") { R.err = {}; draw(); }
  else if (act === "rerun") rerun(parts[1], parts[2], Number(parts[3]));
  else if (act === "row") { const key = parts.slice(1).join(":"); S.open.has(key) ? S.open.delete(key) : S.open.add(key); S.focusRow = key; draw(); }
  else if (act === "resetask") { R.confirmReset = true; draw(); }
  else if (act === "resetno") { R.confirmReset = false; draw(); }
  else if (act === "reset") startEmpty();
  else if (act === "warm") { R.note = ""; const ids = ALL.map((l) => l.id); ensure("v1", ids, true); ensure("v2", ids, true); }
});
$("prev").addEventListener("click", prev);
$("next").addEventListener("click", next);
$("jump").addEventListener("change", (e) => go(Number(e.target.value)));
SCREENS.forEach((sc, k) => {
  const o = document.createElement("option");
  o.value = String(k); o.textContent = `${k + 1}. ${sc.title}`;
  $("jump").appendChild(o);
  const d = document.createElement("button");
  d.className = "dot"; d.type = "button"; d.setAttribute("aria-label", `Screen ${k + 1}: ${sc.title}`);
  d.addEventListener("click", () => go(k));
  $("dots").appendChild(d);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, "start");
  else if (e.key === "End") go(SCREENS.length - 1, "end");
  else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; draw(); }
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== S.i) go(n - 1); });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
setInterval(() => document.querySelectorAll("[data-since]").forEach((e) => { e.textContent = Math.floor((Date.now() - Number(e.dataset.since)) / 1000) + " s"; }), 1000);
fetch("/api/health").then((r) => (r.ok ? r.json() : Promise.reject(new Error("no server"))))
  .then((j) => { R.status = "live"; R.actor = j.actor; R.grader = j.grader; R.mode = j.mode; R.recorded = j.recorded; redraw(); })
  .catch(() => { R.status = "offline"; redraw(); });
</script>
</body>
</html>
