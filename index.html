<html lang="en" data-mode="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Engineering for Prompt Optimization</title>

<!-- Eklavya design tokens and the Archer Cloak mascot, copied from web/public so this page stays one offline file.
     Only the web fonts are fetched; offline, the stacks fall back to system faces. -->
<style>
/* ============================================================
   Eklavya design tokens.

   Two layers, and the order matters:

   1. A SCALE — accent ramp, type, spacing, radii, motion. Fixed
      values that mean the same thing on every ground.
   2. GROUNDS — `ink` (default) and `paper`, each redefining the
      same set of ROLE tokens. Components must only ever name a
      role (--ink, --dim, --line, --spot). Naming a scale step or
      a raw hex in a component is a bug: it pins that component to
      one ground and the theme toggle stops working for it.

   The ground is set as data-mode on <html> by a blocking inline
   script in each page's <head>, before this file loads. Custom
   properties inherit, so flipping that one attribute re-resolves
   every role for the whole tree.

   Ink is the default and `auto` resolves to ink. That is a
   presentation decision, deliberately not the reader's OS setting:
   Eklavya is a terminal plugin and the dark ground is the product.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* ---------- ACCENT: verdigris ----------
     Aged bronze on a bow fitting. One hue, spent sparingly. The
     ground blocks below pick which step is --spot; these steps are
     for the rare tint or border that needs a specific value. */
  --vd-50:  #E6F7F3;
  --vd-100: #C4EDE4;
  --vd-200: #9BE0D2;
  --vd-300: #79D5C4; /* accent on ink   — 10.33:1 */
  --vd-400: #3FB8A3;
  --vd-500: #199688;
  --vd-600: #0E6E66;
  --vd-700: #0A5751; /* accent on paper — 7.20:1 on the ground, 5.10:1 on a tint */
  --vd-800: #07403C;
  --vd-900: #052E2B;

  /* ---------- MASCOT IDENTITY ----------
     Archer Cloak artwork keeps its approved identity across both grounds.
     UI chrome continues to use the surface, text and accent roles below. */
  --mascot-coral: #ef9875;
  --mascot-coral-dark: #c96d51;
  --mascot-highlight: #ffc8a6;
  --mascot-cloak: #0E6E66;
  --mascot-cloak-dark: #07403C;
  --mascot-thread: #C4EDE4;
  --mascot-ink: #302c2a;
  --mascot-metal: #5b7c73;
  --mascot-wood: #bc9569;
  --mascot-wood-dark: #74583f;
  --mascot-string: #EAE7E1;
  --mascot-shadow: #26262a;
  /* ---------- END MASCOT IDENTITY ---------- */

  /* ---------- SEMANTIC (real errors and warnings only) ----------
     Kept off the accent hue so state never reads as branding. --warning and
     --error are redefined per ground below: an orange that carries on ink is
     2.3:1 on cream, which fails as text and as a chart fill alike. */
  --info:    #4A9EFF;

  /* ---------- TYPE FAMILIES ----------
     Two extremes, no middle: enormous tight display, tiny wide-
     tracked uppercase mono. Body text stays small and quiet. */
  --font-disp: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* ---------- TYPE SCALE ---------- */
  --text-xs:   12px;  --lh-xs:   16px;
  --text-sm:   14px;  --lh-sm:   20px;
  --text-base: 16px;  --lh-base: 24px;
  --text-md:   18px;  --lh-md:   28px;
  --text-lg:   20px;  --lh-lg:   28px;
  --text-xl:   24px;  --lh-xl:   32px;
  --text-2xl:  30px;  --lh-2xl:  38px;
  --text-3xl:  38px;  --lh-3xl:  46px;
  --text-4xl:  48px;  --lh-4xl:  56px;
  --text-5xl:  60px;  --lh-5xl:  66px;

  /* Display sizes are fluid — they set the page's confidence, and a
     fixed 40px hero reads timid on a wide screen. */
  --display-hero: clamp(38px, 6.4vw, 120px);
  --display-1:    clamp(34px, 4.6vw, 68px);
  --display-2:    clamp(28px, 3.2vw, 44px);

  --weight-regular: 400;
  --weight-medium:  500;
  --weight-semibold:600;
  --weight-bold:    800;
  --weight-extra:   900;

  /* Display tracking is aggressively negative — this, plus the
     sub-1 leading, is most of what reads as "designed". */
  --tracking-display: -0.055em;
  --tracking-tight:   -0.045em;
  --tracking-snug:    -0.02em;
  --tracking-normal:  0;
  --tracking-caps:    0.16em;
  --tracking-caps-wide: 0.24em;

  --leading-display: 0.9;

  /* ---------- SPACING (4px base) ---------- */
  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;
  --space-5: 20px;  --space-6: 24px;  --space-8: 32px;  --space-10: 40px;
  --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-24: 96px;

  --gut: 34px;   /* frame gutter */
  --max: 1440px; /* frame width  */

  /* ---------- RADII ----------
     The chrome is square: hairline rules, not rounded cards. The
     showpieces keep their own geometry — see --radius-term. */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-pill: 999px;
  --radius-term: 16px; /* the hero terminal and the arrow scene only */

  /* ---------- MOTION ----------
     Consumed by the arrow flight and the terminal loop. Do not
     retime these without re-checking both. */
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
  --ease: cubic-bezier(.2,.6,.2,1);
}

/* ============================================================
   GROUNDS
   Every role below exists in both blocks. A role defined in only
   one of them renders one ground's text on the other's surface.
   ============================================================ */

:root,
:root[data-mode="ink"] {
  --bg:       #17171a; /* page */
  /* The mascot hero deliberately keeps its ink ground in either theme. */
  --hero-bg: #17171a;
  --hero-panel: #1e1e22;
  --hero-ink: #EAE7E1;
  --hero-dim: #A29C93;
  --hero-spot: #79D5C4;
  --hero-line: #33333a;
  --panel:    #1e1e22; /* raised band, sidebar */
  --mass:     #26262a; /* wells, inline code */

  --ink:      #EAE7E1; /* primary text */
  --dim:      #A29C93; /* secondary */
  --faint:    #8B857B; /* captions, micro-labels — 4.89:1 on ink */
  --faint-2:  #565249; /* disabled, placeholder */

  --line:     #26262a; /* hairline */
  --line-2:   #33333a; /* stronger hairline, frame edges */

  --spot:     var(--vd-300);
  --spot-ink: #17171a; /* text ON a --spot fill */
  --spot-soft: color-mix(in srgb, var(--spot) 14%, transparent);
  --warning-soft: color-mix(in srgb, var(--warning) 14%, transparent);

  --grid:     #1f1f23; /* background rule grid */
  --glow:     rgba(25,150,136,.22);  /* the terminal's halo */
  --glow-low: rgba(25,150,136,.10);
  --shot-op:  .28;                   /* the arrow scene, as ambient art */
  --warning:  #E8920C;
  --error:    #FF6166;               /* 4.82:1 on its own 12% tint over --panel */
  --code-bg:  var(--mass);           /* the well behind a code block */
  --code-str: #E6C060;               /* strings in an artifact's code — 9.55:1 on --panel */
  --code-num: #D4A5F5;               /* numbers and literals — 8.31:1 on --panel */
  /* Diagram categories (explainer artifacts only). Ink: 4.5:1 or more on --panel and --mass. Colour names a group, always with a text label. */
  --viz-1: #79D5C4; /* teal */
  --viz-1-soft: color-mix(in srgb, var(--viz-1) 16%, transparent);
  --viz-2: #F0B14A; /* amber */
  --viz-2-soft: color-mix(in srgb, var(--viz-2) 16%, transparent);
  --viz-3: #7FB2F5; /* blue */
  --viz-3-soft: color-mix(in srgb, var(--viz-3) 16%, transparent);
  --viz-4: #B79CF2; /* violet */
  --viz-4-soft: color-mix(in srgb, var(--viz-4) 16%, transparent);
  --viz-5: #F28FA8; /* rose */
  --viz-5-soft: color-mix(in srgb, var(--viz-5) 16%, transparent);
  --shadow-lg: 0 12px 28px rgba(0,0,0,.45);
  --ring:     0 0 0 2px var(--bg), 0 0 0 4px var(--spot);
}

:root[data-mode="paper"] {
  --bg:       #f0ede6;
  --hero-bg: #17171a;
  --hero-panel: #1e1e22;
  --hero-ink: #EAE7E1;
  --hero-dim: #A29C93;
  --hero-spot: #79D5C4;
  --hero-line: #33333a;
  --panel:    #e7e3da;
  --mass:     #ddd8cc;

  --ink:      #16150f;
  --dim:      #57534a;
  --faint:    #635E52; /* 5.04:1 on --panel, the darkest ground it sits on */
  --faint-2:  #a09a8c;

  --line:     #e3dfd4;
  --line-2:   #cec8b9;

  --spot:     var(--vd-700);
  --spot-ink: #ffffff;
  --spot-soft: color-mix(in srgb, var(--spot) 10%, transparent);
  --warning-soft: color-mix(in srgb, var(--warning) 10%, transparent);

  --grid:     #e5e1d7;
  /* a light ground carries far less glow before it reads as a stain, and
     line art needs more weight on it than it does on ink */
  --glow:     rgba(14,110,102,.10);
  --glow-low: rgba(14,110,102,.05);
  --shot-op:  .5;
  --warning:  #7A4B00;               /* 5.21:1 on --mass */
  --error:    #A8201A;               /* 4.70:1 on its own 12% tint over --panel */
  /* A syntax theme's dimmest token (comments) lands at 3.9:1 on --mass. The
     well is lightened rather than the theme repainted, which lifts every
     token at once; the frame's border is what still reads it as a block. */
  --code-bg:  #EDEAE2;
  --code-str: #6F5300;               /* 5.63:1 on --panel */
  --code-num: #6B3FA0;               /* 5.77:1 on --panel */
  /* Diagram categories (explainer artifacts only). Paper: 4.5:1 or more on --panel and --mass. Colour names a group, always with a text label. */
  --viz-1: #0A5751; /* teal */
  --viz-1-soft: color-mix(in srgb, var(--viz-1) 12%, transparent);
  --viz-2: #7F4A00; /* amber */
  --viz-2-soft: color-mix(in srgb, var(--viz-2) 12%, transparent);
  --viz-3: #1D4F9C; /* blue */
  --viz-3-soft: color-mix(in srgb, var(--viz-3) 12%, transparent);
  --viz-4: #5B3DB0; /* violet */
  --viz-4-soft: color-mix(in srgb, var(--viz-4) 12%, transparent);
  --viz-5: #A32D55; /* rose */
  --viz-5-soft: color-mix(in srgb, var(--viz-5) 12%, transparent);
  --shadow-lg: 0 12px 28px rgba(22,21,15,.10);
  --ring:     0 0 0 2px var(--bg), 0 0 0 4px var(--spot);
}

/* ============================================================
   THE TERMINAL
   The hero terminal is a picture of a terminal, and terminals are
   dark — so it keeps one palette on both grounds rather than
   flipping. These are the only colours on the site that do not
   follow the ground, and that is deliberate.
   ============================================================ */
:root {
  --term-bg:     #121215;
  --term-chrome: #1c1c20;
  --term-line:   #2b2b31;
  --term-text:   #C8CDD4;
  --term-dim:    #96939B;
  --term-bright: #FFFFFF;
  --term-claude: #D97757;
  --term-spot:   var(--vd-300);
  --term-cmd:    #8ECF7A;
  --term-str:    #E6C060;
  --term-err:    #FF6166;
}

</style>
<style>
/* Identity colours and UI surfaces use Eklavya's semantic tokens. */
eklavya-mascot { display:inline-flex; flex-shrink:0; vertical-align:middle; line-height:0; }
.ek-mascot { display:block; overflow:visible; flex-shrink:0; }
.ek-mascot[data-variant="face"] { overflow:hidden; }
.ek-mascot__face path:not([fill]) { fill:none; }
.ek-mascot--loading .ek-mascot__character { animation:ek-breathe 2.8s ease-in-out infinite; transform-origin:95px 185px; }
.ek-mascot--loading .ek-mascot__arrow { animation:ek-release 2.8s cubic-bezier(.3,0,.3,1) infinite; }
.ek-mascot--loading .ek-mascot__string { animation:ek-draw 2.8s ease-in-out infinite; transform-origin:157px 125px; }
.ek-mascot--loading .ek-mascot__ripple { animation:ek-hit 2.8s ease-out infinite; transform-origin:196px 128px; opacity:0; }
@keyframes ek-breathe { 0%,100% {transform:translateY(0)} 35%,55% {transform:translateY(-3px) rotate(-1deg)} }
@keyframes ek-release { 0%,12% {transform:translateX(0);opacity:1} 40%,52% {transform:translateX(-10px);opacity:1} 68% {transform:translateX(22px);opacity:0} 69%,85% {transform:translateX(0);opacity:0} 100% {transform:translateX(0);opacity:1} }
@keyframes ek-draw { 0%,100% {transform:scaleX(1)} 40%,52% {transform:scaleX(1.11)} 60% {transform:scaleX(.08)} 68% {transform:scaleX(1)} }
@keyframes ek-hit { 0%,60%,100% {opacity:0;transform:scale(.4)} 68% {opacity:.8;transform:scale(.7)} 88% {opacity:0;transform:scale(1.7)} }
.ek-companion { display:flex;align-items:center;gap:12px;color:var(--dim);font:13px/1.5 var(--font-body); }
.ek-companion--hero { margin-bottom:16px; }
.ek-companion--hero b { display:block;color:var(--ink);font-weight:600; }
.ek-mascot-message { display:flex;align-items:center;gap:16px;padding:16px 0; }
.ek-mascot-message p {margin:0}
@media (prefers-reduced-motion:reduce) { .ek-mascot * {animation:none !important;transition:none !important} }

.ek-companion--rail { padding:12px 20px; text-decoration:none; }
.ek-mascot-message > :last-child { min-width:0; overflow-wrap:break-word; }
.ek-mascot-status { display:inline-flex; align-items:center; gap:6px; }

</style>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: clamp(16px, 1.3vw, 20px); line-height: 1.6;
    display: flex; flex-direction: column; overflow: hidden;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  header, footer { display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: var(--bg); border-color: var(--line-2); }
  header { border-bottom: 1px solid var(--line-2); }
  footer { border-top: 1px solid var(--line-2); }
  .brand { display: inline-flex; align-items: center; gap: 10px; font: 900 19px var(--font-disp); letter-spacing: var(--tracking-snug); color: var(--ink); }
  .brand i { display: grid; place-items: center; width: 30px; height: 30px; background: var(--spot); color: var(--spot-ink); }
  .mono { font-family: var(--font-mono); font-size: 0.72em; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--faint); }
  .crumb { flex: 1; color: var(--dim); font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 0;
    padding: 6px 10px; font: inherit; font-size: 0.75em; max-width: 40vw;
  }
  main { flex: 1; min-height: 0; overflow: auto; padding: 24px 24px 120px; outline: none; }
  .stage { min-height: 100%; display: flex; flex-direction: column; }
  .slide { margin: auto; width: 100%; max-width: 1080px; }
  .head { text-align: center; margin-bottom: 28px; }
  h1, h2, h3 { font-family: var(--font-disp); margin: 0; }
  h1 { font-size: var(--display-1); line-height: 0.98; letter-spacing: var(--tracking-tight); font-weight: 900; }
  h2 { font-size: var(--display-2); line-height: 1.05; letter-spacing: var(--tracking-tight); font-weight: 900; }
  h3 { font-size: 0.7em; font-family: var(--font-mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--spot); font-weight: 600; margin-bottom: 8px; }
  em { font-style: normal; color: var(--spot); }
  p { margin: 0 0 12px; color: var(--dim); }
  .lede { font-size: 1.05em; color: var(--dim); max-width: 40em; margin: 12px auto 0; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.7em; letter-spacing: var(--tracking-caps-wide); text-transform: uppercase; color: var(--spot); margin-bottom: 12px; }
  .cluster { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .cluster > * { flex: 1 1 260px; max-width: 360px; }
  .cluster.wide > * { max-width: 520px; flex-basis: 340px; }
  .card { background: var(--panel); border: 1px solid var(--line-2); padding: 16px 18px; }
  .card ul { margin: 0; padding-left: 1.1em; color: var(--dim); }
  .card li { margin-bottom: 6px; }
  .card p:last-child { margin-bottom: 0; }
  .block { width: fit-content; min-width: min(560px, 100%); max-width: 100%; margin: 0 auto 16px; }
  pre.prompt {
    margin: 0 auto 16px; padding: 16px 20px; background: var(--code-bg); border: 1px solid var(--line-2);
    font-family: var(--font-mono); font-size: 0.8em; line-height: 1.6; white-space: pre-wrap; color: var(--ink);
    width: fit-content; min-width: min(560px, 100%); max-width: 100%;
  }
  pre.prompt .add { background: var(--spot-soft); outline: 1px solid var(--spot); }
  pre.prompt .var { color: var(--code-str); }
  pre.term {
    margin: 0 auto 16px; padding: 14px 18px; background: var(--term-bg); border: 1px solid var(--term-line); color: var(--term-text);
    font-family: var(--font-mono); font-size: 0.8em; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
    width: fit-content; min-width: min(560px, 100%); max-width: 100%;
  }
  pre.term .p { color: var(--term-spot); } pre.term .c { color: var(--term-dim); } pre.term .s { color: var(--term-str); } pre.term .k { color: var(--term-cmd); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 0.8em; cursor: pointer; color: var(--ink); border-radius: 0;
    background: var(--panel); border: 1px solid var(--line-2); padding: 8px 16px;
    transition: border-color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease);
  }
  button:hover:not([disabled]) { border-color: var(--spot); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }
  button.primary { background: var(--spot); border-color: var(--spot); color: var(--spot-ink); font-weight: 700; }
  button.primary:hover:not([disabled]) { background: var(--ink); border-color: var(--ink); }
  button.tab { padding: 5px 12px; font-size: 0.75em; }
  button.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  button[disabled] { opacity: 0.4; cursor: default; }
  a { color: var(--spot); }
  .tcard { text-align: left; display: block; width: 100%; padding: 12px 14px; }
  .tcard b { display: block; color: var(--ink); margin-bottom: 4px; font-family: var(--font-disp); font-weight: 800; }
  .tcard span { display: block; color: var(--dim); font-size: 0.78em; line-height: 1.45; }
  .tcard .state { font-family: var(--font-mono); font-size: 0.62em; letter-spacing: var(--tracking-caps); text-transform: uppercase; margin-bottom: 6px; color: var(--faint); }
  .tcard.done, .tcard.done[disabled] { border-color: var(--spot); background: var(--spot-soft); opacity: 1; }
  .tcard.done .state { color: var(--spot); }
  .tcard.active { border-color: var(--spot); }
  .tcard.active .state { color: var(--spot); }
  .tcard.locked { opacity: 0.4; cursor: default; }
  .shelf { margin-top: 20px; }
  .shelf > * { flex-basis: 170px; max-width: 230px; }
  .out { background: var(--code-bg); border: 1px solid var(--line-2); padding: 10px 14px; font-family: var(--font-mono); font-size: 0.74em; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .out small { display: block; color: var(--faint); margin-bottom: 4px; font-family: var(--font-body); font-size: 0.95em; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78em; margin-bottom: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  th { color: var(--faint); font-weight: 600; font-family: var(--font-mono); font-size: 0.82em; text-transform: uppercase; letter-spacing: var(--tracking-caps); }
  td.num, th.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
  td.log { font-family: var(--font-mono); font-size: 0.92em; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 8px; font-family: var(--font-mono); font-size: 0.78em; border: 1px solid var(--line-2); color: var(--dim); }
  .pill.train { border-color: var(--spot); color: var(--spot); }
  .pill.val { border-color: var(--warning); color: var(--warning); }
  .pill.test { border-color: var(--error); color: var(--error); }
  .chip { display: inline-block; padding: 3px 10px; margin: 0 6px 6px 0; font-family: var(--font-mono); font-size: 0.74em; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); }

    notes: "Two training logs that show a type mismatch. Run again, the optimizer adds one rule, then the table. Then be honest: we peeked at test to find this, so its test number is no longer clean.",
    render: (st) => {
      const added = LOGS.filter((l) => l.added);
      const rows = [
        { n: 0, read: "Starting prompt (v3), train set now 8 logs", edit: "None", tr: mean("v3", "train", true), va: mean("v3", "val"), verdict: "start" },
        { n: 1, read: "Logs 13 and 14 (type mismatches) were called DATA_QUALITY.", edit: ADD4.join(" "), tr: mean("v4", "train", true), va: mean("v4", "val"), verdict: "kept" },
      ];
      const shown = rows.slice(0, Math.min(st, 2));
      const t = (v) => f3(mean(v, "test"));
      const optTable = `<div class="scroll"><table class="compact"><thead><tr><th>#</th><th>What it read</th><th>Edit it proposed</th><th class="num">train</th><th class="num">val</th><th>Kept?</th></tr></thead>
        <tbody>${shown.map((r) => `<tr class="reveal"><td class="num">${r.n}</td><td>${esc(r.read)}</td><td style="white-space:normal">${esc(r.edit)}</td><td class="num">${f3(r.tr)}</td><td class="num">${f3(r.va)}</td><td class="${r.verdict === "kept" ? "ok" : "faint"}">${esc(r.verdict)}</td></tr>`).join("")}</tbody></table></div>`;
      const logs = `<div class="scroll"><table class="compact"><thead><tr><th>#</th><th>Pipeline</th><th>Split</th><th>Log</th><th class="num">Expected</th></tr></thead><tbody>
        ${added.map((l) => `<tr><td class="num">${l.id}</td><td>${esc(l.pipe)}</td><td>${splitPill(l.split)}</td><td class="log" title="${esc(l.text)}">${esc(l.text)}</td><td class="num">${esc(l.exp)}</td></tr>`).join("")}</tbody></table></div>`;
      if (st === 3) {
        return `${head("Version 4", "One more rule, <em>appended</em>", "", true)}
          <pre class="prompt small reveal">${segsHtml(v2Segs(5, ADD3.concat(ADD4), ADD3.length, false))}</pre>`;
      }
      if (st >= 4) {
        return `${head("Version 4, scored", "The number you <em>cannot trust</em>", "", true)}
          <div class="block scroll reveal"><table><thead><tr><th>Prompt</th><th class="num">val</th><th class="num">test</th></tr></thead><tbody>
            <tr><td>v2</td><td class="num">${f3(mean("v2", "val"))}</td><td class="num">${t("v2")}</td></tr>
            <tr><td>v3</td><td class="num">${f3(mean("v3", "val"))}</td><td class="num">${t("v3")}</td></tr>
            <tr><td>v4</td><td class="num">${f3(mean("v4", "val"))}</td><td class="num warn">${t("v4")} <span class="pill test">peeked</span></td></tr></tbody></table></div>
          <div class="note warnnote reveal"><b>The v4 test number is not clean.</b> We looked at test to find the gap, then changed the data because of it. To claim it, hold out a fresh test pipeline. Also, three logs per split is a toy: one wrong label moves a split by 0.222. And v4 is not 1.000 only because one reply ran past 15 words, though the prompt asks for 15 or fewer. An instruction is a request. A check is a rule.</div>`;
      }
      return `${head("Run 2", "Add the examples it was <em>missing</em>", "", true)}${logs}
        ${st === 0 ? `<div class="row" style="margin-top:12px"><button class="primary" data-act="next">Run the optimizer again</button></div>` : ""}
        ${shown.length ? optTable : ""}`;
    },
  },
  {
    id: "real", title: "A real run, from Eklavya", tag: "real", steps: 2,
    hints: [["neutral", "Real numbers now, from Eklavya's own result notes."], ["worried", "A limit the score ignored."], ["wink", "This slot is ready for the fixed evals."]],
    notes: "These two are real, from Eklavya's own result notes (9 and 10 October 2026). Replace or extend after the evals are fixed.",
    render: (st) => `
      ${head("Not a mock", "The same lessons, from a <em>real</em> tool")}
      <div class="cluster wide">
        <div class="card reveal"><h3>Validation against test</h3>
          <p>A GEPA candidate for Eklavya's question-writing prompt.</p>
          <table><thead><tr><th></th><th class="num">Shipped</th><th class="num">Candidate</th></tr></thead><tbody>
            <tr><td>Validation (chosen on)</td><td class="num">0.48</td><td class="num">0.79</td></tr>
            <tr><td>Test (untouched)</td><td class="num">0.545</td><td class="num">0.637</td></tr></tbody></table>
          <p class="faint" style="margin-top:8px">The note's own words: that gap is selection, not generalisation. Recommendation: do not ship the candidate.</p></div>
        ${st >= 1 ? `<div class="card reveal"><h3>A limit the score ignored</h3>
          <p>A GEPA candidate for Eklavya's prompt feedback.</p>
          <table><thead><tr><th></th><th class="num">Shipped</th><th class="num">Candidate</th></tr></thead><tbody>
            <tr><td>Timeouts</td><td class="num">1 of 15</td><td class="num">6 of 15</td></tr>
            <tr><td>Pass every gate</td><td class="num">10 of 15</td><td class="num">6 of 15</td></tr>
            <tr><td>Mean score</td><td class="num">0.718</td><td class="num">0.456</td></tr></tbody></table>
          <p class="faint" style="margin-top:8px">Latency was reported but not scored, so the search could not see it. Not shipped.</p></div>` : ""}
      </div>
      ${st >= 2 ? `<div class="placeholder reveal">Placeholder: swap in a before and after from the fixed evals when they exist (Eklavya issue #235).</div>` : ""}`,
  },
  {
    id: "checklist", title: "The checklist", tag: null, steps: 3,
    hints: [["focused", "Gates, examples, and a split by source."], ["focused", "Baseline, a bar, and every limit in the score."], ["happy", "Record it, enforce it in code, look at test once."], ["celebrate", "Questions welcome."]],
    notes: "Three items at a time. Read none of it aloud. Pick the two you most want them to remember. Then questions.",
    render: (st) => {
      const items = [
        "<b>Write the gates first.</b> Hard requirements as pass or fail.",
        "<b>Freeze examples</b> with the expected answer next to each.",
        "<b>Split by source,</b> not by row.",
        "<b>Baseline with repeats.</b> Score the current prompt the same way.",
        "<b>Fix the bar up front.</b> How many examples, how much difference counts.",
        "<b>Put every limit in the score:</b> time, size, cost.",
        "<b>Record everything:</b> model ids, tokens, seed.",
        "<b>Code before wording</b> when code can enforce it.",
        "<b>Look at test once,</b> and say so if you looked twice.",
      ];
      return `
      ${head("Take this home", "Before you point an optimizer at a <em>prompt</em>")}
      <ol class="checks">${items.slice(0, Math.min(9, (st + 1) * 3)).map((x) => `<li class="reveal">${x}</li>`).join("")}</ol>
      ${st >= 3 ? `<p class="lede reveal" style="text-align:center;margin-top:24px">Questions?</p>` : ""}`;
    },
  },
];

/* ---------- navigation ---------- */
const $ = (id) => document.getElementById(id);
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(i, mode) {
  clearInterval(timer);
  S.i = Math.max(0, Math.min(SCREENS.length - 1, i));
  const sc = SCREENS[S.i];
  if (mode === "start") setStep(sc.id, 0);
  else if (mode === "end") setStep(sc.id, sc.steps);
  if (location.hash !== "#" + (S.i + 1)) history.replaceState(null, "", "#" + (S.i + 1));
  draw();
}
function next() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st < sc.steps) { setStep(sc.id, st + 1); draw(); }
  else if (S.i < SCREENS.length - 1) go(S.i + 1, "start");
}
function prev() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  if (st > 0) { clearInterval(timer); setStep(sc.id, st - 1); draw(); }
  else if (S.i > 0) go(S.i - 1, "end");
}
function draw() {
  const sc = SCREENS[S.i], st = stepOf(sc.id);
  const slide = $("slide");
  const before = S.last === sc.id ? slide.getBoundingClientRect() : null;
  slide.innerHTML = sc.render(st);
  // The slide is vertically centred, so adding content moves it. Glide it instead of jumping.
  if (before && !reduced() && slide.animate) {
    const dy = before.top - slide.getBoundingClientRect().top;
    if (Math.abs(dy) > 2) slide.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: 280, easing: "cubic-bezier(.2,.6,.2,1)" });
  }
  if (S.last !== sc.id) $("main").scrollTop = 0;
  S.last = sc.id;
  $("count").textContent = `${String(S.i + 1).padStart(2, "0")} / ${SCREENS.length}`;
  $("crumb").textContent = sc.title;
  $("jump").value = String(S.i);
  const tag = $("tag");
  const tagText = { example: "Example data", real: "Real data", ref: "From the GEPA repo" }[sc.tag] || "";
  tag.hidden = !tagText;
  tag.className = "tag " + (sc.tag || "");
  tag.textContent = tagText;
  $("stepinfo").textContent = sc.steps ? `step ${st} / ${sc.steps}` : "";
  $("prev").disabled = S.i === 0 && st === 0;
  $("next").disabled = S.i === SCREENS.length - 1 && st >= sc.steps;
  document.querySelectorAll(".dot").forEach((d, k) => d.setAttribute("aria-current", String(k === S.i)));
  // The companion: a small face and one short line per step. Hidden on the title, where the full mascot already is.
  const hint = sc.hints[Math.min(st, sc.hints.length - 1)];
  const comp = $("companion");
  comp.hidden = !hint[1];
  if (hint[1]) comp.innerHTML = `<div class="mascot">${EklavyaMascot.svg({ expression: hint[0], variant: "face", size: 56 })}</div><div class="bubble reveal">${esc(hint[1])}</div>`;
  const n = $("notes");
  n.hidden = !S.notes;
  n.textContent = sc.notes;
}
function animateTo(max) {
  clearInterval(timer);
  const id = SCREENS[S.i].id;
  timer = setInterval(() => {
    if (SCREENS[S.i].id !== id) { clearInterval(timer); return; }
    const n = stepOf(id) + 1;
    setStep(id, n); draw();
    if (n >= max) clearInterval(timer);
  }, 650);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const [act, arg] = el.dataset.act.split(":");
  const id = SCREENS[S.i].id;
  if (act === "next") next();
  else if (act === "goto") { setStep(id, Number(arg)); draw(); }
  else if (act === "run1") { setStep(id, 1); draw(); animateTo(4); }
});
$("prev").addEventListener("click", prev);
$("next").addEventListener("click", next);
$("jump").addEventListener("change", (e) => go(Number(e.target.value)));
SCREENS.forEach((sc, k) => {
  const o = document.createElement("option");
  o.value = String(k); o.textContent = `${k + 1}. ${sc.title}`;
  $("jump").appendChild(o);
  const d = document.createElement("button");
  d.className = "dot"; d.type = "button"; d.setAttribute("aria-label", `Screen ${k + 1}: ${sc.title}`);
  d.addEventListener("click", () => go(k));
  $("dots").appendChild(d);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, "start");
  else if (e.key === "End") go(SCREENS.length - 1, "end");
  else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; draw(); }
});
window.addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== S.i) go(n - 1); });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
